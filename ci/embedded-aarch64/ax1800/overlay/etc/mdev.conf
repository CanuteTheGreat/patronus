# mdev builds /dev at early boot (the OpenWrt kernels of this board and of the QEMU gate have no devtmpfs). Without these
# lines every node is root:root 0660, so no daemon that drops root (patronus-web, chronyd/chronyc, dnsmasq) could open
# /dev/null or /dev/urandom. Format: <device regex> <uid>:<gid> <mode>; the first match wins.
null     0:0 666
zero     0:0 666
full     0:0 666
random   0:0 666
urandom  0:0 666
tty      0:5 666
ptmx     0:5 666
tty[0-9]* 0:5 620
