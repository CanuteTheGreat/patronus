# Boot rollback policy of this unit (patronus-guard, docs/embedded-routers.md 12.16). The web UI (System > Firmware)
# writes this file; every line is optional (the default is shown).
#GUARD_ENABLED=1              # 0: upgrades are installed without a trial and without a rollback image
#GUARD_REQUIRE=1              # 1: refuse an upgrade that cannot be rolled back (no room / no bootloader environment)
#GUARD_ATTEMPTS=2             # boots a new image gets to confirm itself before the bootloader restores the old one
#GUARD_WINDOW=300             # seconds after power-on for all checks to pass
#GUARD_INTERVAL=5             # seconds between check rounds (watchdog feed interval)
#GUARD_PASS_ROUNDS=2          # consecutive passing rounds that confirm the image
#GUARD_CHECKS="network ssh web hostapd"
#GUARD_NET_PING=gateway       # gateway | none | an address
#GUARD_HOSTAPD=auto           # auto: hostapd must run, and every radio must be up when Wi-Fi is on | require | off
#GUARD_WATCHDOG=1             # hardware watchdog during trial boots (covers hangs)
#GUARD_WATCHDOG_TIMEOUT=30    # seconds (at most 32 on this board)
#GUARD_REBOOT_GRACE=90        # seconds for a clean restart after a failed trial before a forced one
