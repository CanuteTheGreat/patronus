# Clock of the Patronus router tier (chrony; the board has no RTC). chronyd runs with -s, so at every start it moves the
# clock forward to the drift file's time (written about hourly once synced) before the first NTP answer arrives.
# The NTP server page (Services > NTP) replaces this file with its own (servers, `allow` for the served subnets).
pool pool.ntp.org iburst
driftfile /var/lib/chrony/drift
makestep 1.0 3
cmdport 0
