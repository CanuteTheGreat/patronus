# Cargo configuration for Patronus
# Architecture-specific optimizations
#
# NOTE: do NOT put "-C opt-level=3" in these global rustflags. Cargo appends
# rustflags after the active profile's own -C opt-level flag, and rustc takes
# the LAST -C opt-level it sees -- so a global opt-level=3 here silently wins
# over profile.dev's opt-level=1 for every `cargo test`/`cargo check`, not just
# `cargo build --release`. Confirmed via a real CI job log (Rust CI / Test
# (non-eBPF crates), run 2350, patronus-sdwan): the actual rustc invocation
# carried both "-C opt-level=1 ... -C opt-level=3", proving dev/test builds
# were being compiled at release-grade optimization. That's exactly the kind
# of extra compile memory/time dev/test builds don't need, and it was enough
# to get the compiler SIGKILLed on the resource-constrained emulated CI runner.
# Keep opt-level out of here; profile.release below already sets opt-level = 3
# for real release builds.

# Portable baseline for every release/ISO/package/container build: x86-64-v2
# (SSE4.2 + POPCNT, any x86_64 CPU since ~2009), the generic ARMv8-A baseline
# on aarch64, rv64gc on riscv64. NEVER "target-cpu=native" here: a native build
# on the AMD/AVX-512 CI host emitted instructions (BMI2/AVX2/AVX-512) that
# crashed with "invalid opcode" on a real Intel box (2026-10-28 lab VM).
# Host-tuned LOCAL dev builds are opt-in (RUSTFLAGS replaces these flags):
#     PATRONUS_NATIVE=1 ./build-arch.sh        or
#     RUSTFLAGS="-C target-cpu=native" cargo build --release
# ci/check-no-native-cpu.sh and gentoo/live-iso/common/check-cpu-baseline.py
# (run inside the ISO build) fail CI if this regresses.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic"]

[target.riscv64gc-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic-rv64"]

# LTO for release builds
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

# Optimized dev builds for faster iteration
[profile.dev]
opt-level = 1
# Line tables only (backtraces keep file:line). Full DWARF made every test
# binary several times larger: the workspace test build wrote ~20 GB of
# target/ and was the CI memory peak (~/.hermes/state/build-slimming/patronus.md).
debug = "line-tables-only"

# Build scripts and proc-macros
[profile.release.build-override]
opt-level = 0

# Dependencies don't need to be recompiled as often
[profile.dev.package."*"]
opt-level = 2
