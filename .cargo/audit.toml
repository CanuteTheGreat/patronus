# cargo-audit configuration
#
# Ignored advisories below are deep transitive dependencies (reqwest 0.11,
# tonic/rustls 0.101 chain, protobuf via opentelemetry-prometheus, rsa via
# ssh dependencies) that require major version bumps across many crates in
# this workspace to resolve. They are tracked for a follow-up dependency
# modernization pass rather than blocking this CI fix. Update this list as
# each is addressed.
[advisories]
ignore = [
    "RUSTSEC-2026-0187", # lopdf 0.31.0 - transitive via printpdf 0.7 in patronus-bench
                         # (PDF *write*-only export path; patronus-bench never parses
                         # untrusted PDFs via lopdf, so the "deeply nested PDF objects"
                         # stack-overflow-on-parse advisory has no reachable attack
                         # surface here. Fixed upstream in lopdf >=0.42, which requires
                         # printpdf >=0.11 - a breaking API rewrite (layers/use_text API
                         # replaced entirely by an Op-based model) deferred to a
                         # dedicated follow-up rather than done blind in a CI-fix pass.
    "RUSTSEC-2026-0258", # h2 0.3.27 - transitive via reqwest 0.11 (many crates)
    "RUSTSEC-2024-0421", # idna 0.2.3/0.4.0 - transitive via url/reqwest/redis chains
    "RUSTSEC-2024-0437", # protobuf 2.28.0 - transitive via opentelemetry-prometheus/prometheus
    "RUSTSEC-2025-0009", # ring 0.16.20 - transitive via old rustls/tonic chain
    "RUSTSEC-2023-0071", # rsa 0.9.10 - no fixed upgrade available upstream
    "RUSTSEC-2026-0098", # rustls-webpki 0.101.7 - transitive via old rustls/tonic chain
    "RUSTSEC-2026-0104", # rustls-webpki 0.101.7 - transitive via old rustls/tonic chain
    "RUSTSEC-2026-0099", # rustls-webpki 0.101.7 - transitive via old rustls/tonic chain
]

# Unmaintained-crate warnings (not vulnerabilities) for transitive deps we
# don't control directly; informational only, does not fail the audit.
informational_warnings = ["unmaintained", "unsound"]
