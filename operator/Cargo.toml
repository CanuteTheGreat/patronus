[package]
name = "patronus-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "patronus-operator"
path = "src/main.rs"

[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

[dependencies]
# Kubernetes client
kube = { version = "0.87", default-features = false, features = ["runtime", "derive", "client", "admission", "openssl-tls"] }
k8s-openapi = { version = "0.20", features = ["v1_28"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client for Patronus API (switched from rustls-tls to native-tls/OpenSSL:
# kube's own rustls-tls dep chain was stuck on rustls 0.21.x which has
# RUSTSEC-2026-0349/0346; rather than mix TLS stacks we use OpenSSL
# consistently here and for kube below -- libssl-dev is already a CI dep.)
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }

# Metrics
prometheus = "0.13"

# Utilities
chrono = "0.4"
hostname = "0.3"
