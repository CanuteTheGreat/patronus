# Patronus LiveCD Portage configuration
# Built for maximum compatibility across x86-64 systems

CFLAGS="-O2 -march=x86-64 -mtune=generic -pipe"
CXXFLAGS="${CFLAGS}"
RUSTFLAGS="-C target-cpu=x86-64"

# Parallel build
MAKEOPTS="-j4"

# Use flags for LiveCD
# -multilib: amd64-only LiveCD, no 32-bit userspace needed -- also works
# around a gcc bootstrap failure building its own 32-bit nvptx offload
# plugin (pthread_key_t undeclared) that only shows up when multilib is
# enabled under QEMU/Rosetta cross-emulation.
USE="-systemd nftables ncurses readline ssl -X -gtk -kde -gnome -qt5 -wayland -multilib"

# Accept licenses
ACCEPT_LICENSE="*"

# Features
FEATURES="parallel-fetch"

# Locale
LINGUAS="en"
L10N="en"
