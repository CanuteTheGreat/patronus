# Patronus profile for the shared guided installer (live-installer)
name = "patronus"
title = "Patronus"
network_mode = "wan-lan"             # OPNsense-style WAN/LAN assignment
filesystems = ["zfs", "xfs", "ext4"]  # ZFS default (single disk or mirror); XFS = automatic fallback (RAM < 8 GB, no ZFS module for the kernel/arch); ext4 = manual Advanced choice, never preselected
# Disk encryption (owner decision 2026-11-03): a firewall must boot with nobody at the console. ZFS is natively encrypted ONLY when a working
# TPM 2.0 can unseal the key unattended (the installer self-tests seal+unseal); otherwise the disk is NOT encrypted and nothing is ever asked at boot.
# The passphrase / xfs-luks variants are therefore not offered for this product.
encryption = "tpm-or-none"
swap_mb = 0
portable_swap = false              # firewall appliance: never an on-disk swap (zram only), even on a laptop-class box under auto
web_scheme = "https"
web_port = 443
default_hostname = "patronus.localdomain"
# the web UI signs in SYSTEM users through PAM (service "patronus"); rights come from the groups patronus-admin / wheel. The installer
# creates that user: there is no 'admin' account and no generated first-boot password.
web_auth = "pam"
web_admin_group = "patronus-admin"
services = ["patronus-firewall", "patronus-applyd", "patronus-web", "patronus-services", "chronyd", "sshd", "dhcpcd"]
# console menu (installed system)
web_service = "patronus-web"
db_path = "/var/lib/patronus/config.db"
db_table = "web_users"
config_paths = ["/etc/patronus", "/var/lib/patronus/config.db"]
factory_reset_files = []
reapply_services = ["patronus-firewall", "patronus-applyd"]
# console menu 1 (Assign interfaces) writes wan/lan/opt_interfaces into patronus.toml, then this hands them to the store
# (the file is only read at the first boot)
roles_sync_cmd = ["patronus", "interfaces", "assign", "--from-bootstrap"]
# update channel: chosen on the installer's Services page / answer file [update] channel; written to [update] channel
update_channels = ["stable", "testing", "development"]
update_channel_file = "/etc/patronus/patronus.toml"
update_channel_info = { stable = "tagged releases", testing = "plus release candidates", development = "main branch, live ebuild" }
# Patronus' own console-menu items (liveinst consolemenu.console_items: argv only, {answer} is one argument)
console_items = [
  { key = "15", title = "Firewall log (live; Ctrl+C returns)", run = ["patronus", "firewall", "log", "-n", "40", "--follow"] },
  { key = "16", title = "Update channel (stable / testing / development)", show = ["patronus", "update", "channel"], ask = "New channel (stable, testing or development; Enter keeps it)", run = ["patronus", "update", "channel", "--set", "{answer}"] },
  { key = "17", title = "Check for updates", run = ["patronus", "update", "check"] },
  { key = "18", title = "Update Patronus (shows the last check first)", run = ["patronus", "update", "status"], confirm = "Install the Patronus update now (runs in the background)?", then = ["patronus", "update", "apply"] },
  { key = "19", title = "Restore a configuration revision", show = ["patronus", "config", "revisions"], ask = "Revision id to restore and apply (Enter cancels)", run = ["patronus", "config", "rollback", "{answer}"] },
  { key = "20", title = "Import a pfSense / OPNsense config.xml", ask = "Path of the config.xml (a USB stick is mounted with: mount /dev/sdX1 /mnt)", run = ["patronus", "import", "pfsense", "{answer}", "--plan"], confirm = "Write this plan into the configuration and apply it?", then = [["patronus", "import", "pfsense", "{answer}", "--yes"], ["patronus", "apply"]] },
]

# official logo, crop/scale only (branding/README.md); the installer GUI + boot menu read these
logo_mark = "/usr/share/live-installer/branding/mark-256.png"
logo_full = "/usr/share/live-installer/branding/full.png"
logo_wordmark = "/usr/share/live-installer/branding/wordmark.png"
# "Try it live" boot entry: services started from RAM (random admin password per session; the firewall rules are NOT applied to the live host)
live_services = ["patronus-applyd", "patronus-web"]

# installer pages (stages.py)
brand_color = "#1f6fb2"
services_optional = ["chronyd"]
service_info = { chronyd = "NTP time synchronisation (keeps certificates and logs correct)" }
# a firewall routes: its own sysctl applier owns the network sysctls, so the installer's hardening set stays off
sysctl_hardening = false
use_critical = ["net-firewall/nftables:json"]
use_critical_why = { "net-firewall/nftables:json" = "Patronus reads and writes the ruleset as JSON" }
