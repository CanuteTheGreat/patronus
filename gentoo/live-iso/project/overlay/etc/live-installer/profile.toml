# Patronus profile for the shared guided installer (live-installer)
name = "patronus"
title = "Patronus"
network_mode = "wan-lan"             # OPNsense-style WAN/LAN assignment
filesystems = ["ext4"]
swap_mb = 1024
web_scheme = "https"
web_port = 8443
default_hostname = "patronus.localdomain"
# patronus-web reads this file on its first start (PATRONUS_ADMIN_PASSWORD_FILE default), then it is deleted
admin_password_file = "/var/lib/patronus/initial-admin-password"
admin_password_owner = "patronus"
services = ["patronus-firewall", "patronus-applyd", "patronus-web", "chronyd", "sshd", "dhcpcd"]
# console menu (installed system)
web_service = "patronus-web"
db_path = "/var/lib/patronus/config.db"
db_table = "web_users"
config_paths = ["/etc/patronus", "/var/lib/patronus/config.db"]
factory_reset_files = ["/var/lib/patronus/initial-admin-password"]
reapply_services = ["patronus-firewall", "patronus-applyd"]
