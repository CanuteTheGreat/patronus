# Patronus profile for the shared guided installer (live-installer)
name = "patronus"
title = "Patronus"
network_mode = "wan-lan"             # OPNsense-style WAN/LAN assignment
filesystems = ["zfs", "xfs", "ext4"]  # ZFS default (single disk or mirror); XFS = automatic fallback (RAM < 8 GB, no ZFS module for the kernel/arch); ext4 = manual Advanced choice, never preselected
# Disk encryption (owner decision 2026-11-03): a firewall must boot with nobody at the console. ZFS is natively encrypted ONLY when a working
# TPM 2.0 can unseal the key unattended (the installer self-tests seal+unseal); otherwise the disk is NOT encrypted and nothing is ever asked at boot.
# The passphrase / xfs-luks variants are therefore not offered for this product.
encryption = "tpm-or-none"
swap_mb = 0
portable_swap = false              # firewall appliance: never an on-disk swap (zram only), even on a laptop-class box under auto
web_scheme = "https"
web_port = 8443
default_hostname = "patronus.localdomain"
# patronus-web reads this file on its first start (PATRONUS_ADMIN_PASSWORD_FILE default), then it is deleted
admin_password_file = "/var/lib/patronus/initial-admin-password"
admin_password_owner = "patronus"
services = ["patronus-firewall", "patronus-applyd", "patronus-web", "chronyd", "sshd", "dhcpcd"]
# console menu (installed system)
web_service = "patronus-web"
db_path = "/var/lib/patronus/config.db"
db_table = "web_users"
config_paths = ["/etc/patronus", "/var/lib/patronus/config.db"]
factory_reset_files = ["/var/lib/patronus/initial-admin-password"]
reapply_services = ["patronus-firewall", "patronus-applyd"]

# official logo, crop/scale only (branding/README.md); the installer GUI + boot menu read these
logo_mark = "/usr/share/live-installer/branding/mark-256.png"
logo_full = "/usr/share/live-installer/branding/full.png"
logo_wordmark = "/usr/share/live-installer/branding/wordmark.png"
# "Try it live" boot entry: services started from RAM (random admin password per session; the firewall rules are NOT applied to the live host)
live_services = ["patronus-applyd", "patronus-web"]

# installer pages (stages.py)
brand_color = "#1f6fb2"
services_optional = ["chronyd"]
service_info = { chronyd = "NTP time synchronisation (keeps certificates and logs correct)" }
# a firewall routes: its own sysctl applier owns the network sysctls, so the installer's hardening set stays off
sysctl_hardening = false
use_critical = ["net-firewall/nftables:json"]
use_critical_why = { "net-firewall/nftables:json" = "Patronus reads and writes the ruleset as JSON" }
