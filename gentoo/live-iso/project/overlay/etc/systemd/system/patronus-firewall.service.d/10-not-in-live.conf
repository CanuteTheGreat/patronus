# "Try it live": the firewall rules are never applied to the live host (setup.sh, profile.toml live_services). The OpenRC image never
# starts patronus-firewall there, but under systemd patronus-web.service has Wants=patronus-firewall.service, so starting the web UI from
# live-product pulled in `patronus apply`, which reconfigures the interfaces and ruleset under the live session and raced the web UI's
# WAN address (daily server-systemd-x86_64 run 2290: web-ui-up-in-live-session login live-admin -> 0, no answer for 240 s).
# A failed condition skips the unit (it counts as done for After=/Wants=); the installed system has no rd.live.image on its command line.
[Unit]
ConditionKernelCommandLine=!rd.live.image
