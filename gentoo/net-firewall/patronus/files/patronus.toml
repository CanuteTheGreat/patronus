# Patronus Firewall Configuration
# This file uses TOML format

[system]
hostname = "patronus"
domain = "local"
timezone = "UTC"

[network]
# Interface roles used on FIRST BOOT only: `patronus apply` assigns these
# roles in the config store (/var/lib/patronus/config.db) and seeds the safe
# default ruleset from them -- anti-lockout (SSH + web UI) on the LAN, LAN to
# any allowed, everything inbound on the WAN dropped, outbound masquerade on
# the WAN, IPv4/IPv6 forwarding on. After that the store is authoritative.
# Names that don't exist on the box are ignored; with no LAN the anti-lockout
# rule goes on the WAN, with no roles at all on every interface.
# Lists are accepted too: lan_interfaces = ["eth1", "eth2"].
wan_interface = "eth0"
lan_interface = "eth1"

[firewall]
# Default policies
default_input = "drop"
default_forward = "drop"
default_output = "accept"

# Enable IPv6
ipv6 = true

[web]
# Where the web UI listens. Each key is optional: the built-in default is
# HTTPS on 443, HTTP on 80 that only redirects to HTTPS, and 8443 as an extra
# HTTPS port. The System page (config store) overrides this file.
# (listen_port / use_tls from older releases were never honoured and are gone:
# TLS is always on, the port is https_port.)
listen_addr = "0.0.0.0"
# https_port = 443
# http_redirect_port = 80        # 0 = no plain-HTTP listener
# extra_https_ports = [8443]     # [] = none
# tls_cert = "/etc/patronus/tls/cert.pem"   # both empty = generated self-signed
# tls_key = "/etc/patronus/tls/key.pem"

[dns]
# Enable DNS forwarder
enabled = false
forwarders = ["8.8.8.8", "8.8.4.4", "1.1.1.1"]

[dhcp]
# DHCP server configuration
enabled = false
# range_start = "192.168.1.100"
# range_end = "192.168.1.200"
# gateway = "192.168.1.1"
# lease_time = 86400

[vpn.wireguard]
enabled = false
# listen_port = 51820

[vpn.openvpn]
enabled = false
# port = 1194

[monitoring]
enabled = false
# prometheus_port = 9090

[logging]
level = "info"
# Levels: trace, debug, info, warn, error
