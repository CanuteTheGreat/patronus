# Web UI login = the box's SYSTEM users (PAM service "patronus"; on the
# embedded tier without PAM: /etc/passwd + /etc/group + /etc/shadow).
# There is no built-in admin account and no default password. Rights come
# from group membership; a user in none of these groups is refused, and
# root is refused unless allow_root = true. The highest role wins.
admin_groups    = ["patronus-admin", "wheel"]
operator_groups = []
readonly_groups = []
# allow_root = false
# Accounts created by older releases (own password, stored in Patronus)
# sign in read-only for one release; false = refuse them now.
legacy_local_login = true
