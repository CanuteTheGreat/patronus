# systemd drop-in for net-dns/unbound's unit on a Patronus system (installed as unbound.service.d/patronus.conf).
#
# Patronus writes /etc/unbound/unbound.conf itself (crates/patronus-network/src/dns.rs, seg_dns.rs) with the paths Gentoo's OpenRC
# script uses on both init systems: the remote-control socket /run/unbound.ctl (Patronus drives unbound-control through it) and, when
# a segment has query logging on, /var/log/unbound/unbound.log. The vendor unit runs unbound under ProtectSystem=strict with only
# /etc/unbound writable, so unbound could not create the control socket and exited at the first start after Patronus enabled DNS
# (systemd ISO QEMU gate: "failed unit: unbound.service"). Open exactly those two places, nothing else of the sandbox changes.
[Service]
ReadWritePaths=/run
LogsDirectory=unbound
