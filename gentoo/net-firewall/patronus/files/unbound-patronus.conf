# systemd drop-in for net-dns/unbound's unit on a Patronus system (installed as unbound.service.d/00gentoo.conf).
#
# Patronus writes /etc/unbound/unbound.conf itself (crates/patronus-network/src/dns.rs) with DNSSEC on: unbound (running as user
# `unbound` after it drops root) keeps the trust anchor up to date in /var/lib/unbound/root.key, a directory the image owns as
# root:unbound 0775 (as on OpenRC). The vendor unit declares StateDirectory=unbound but no User=, so systemd chowned that directory to
# root:root at every start and unbound exited: "fatal error: could not open autotrust file for writing" (systemd ISO QEMU gate,
# "failed unit: unbound.service"). Keep the directory's ownership and let the sandbox (ProtectSystem=strict) write there.
[Service]
StateDirectory=
ReadWritePaths=/var/lib/unbound
