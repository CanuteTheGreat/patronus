[package]
name = "seg-spike"
version = "0.0.1"
edition = "2021"
publish = false
description = "Spike for docs/design/device-segmentation.md: nftables + hostapd generation (not part of the workspace)"

# Detached from the Patronus workspace on purpose: it builds in seconds
# and must not be picked up by workspace-wide CI.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
