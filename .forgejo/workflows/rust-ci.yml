name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt/clippy/security-audit/test used to be 4 separate jobs. The only
  # forgejo-runner currently registered for the `x86_64` label (beauxbatons,
  # see .forgejo/workflows/rust-ci.yml history around 2026-10-08) has
  # capacity: 1 -- it can only execute one job at a time, full stop. With 4+
  # independent jobs all competing for that single slot, later jobs in the
  # queue routinely sat unclaimed long enough to get marked "Has been
  # cancelled" before a runner ever picked them up, especially when commits
  # were pushed in quick succession (each push adds its own 4-6 jobs to the
  # same single-slot queue). Merging these four into one sequential job
  # means the whole set only has to win the runner's one slot ONCE instead
  # of 4 times, and shares one checkout/toolchain-install/apt-get install
  # instead of paying that setup cost 4x -- both directly shrink the total
  # queued-and-running wall-clock window this work is exposed to being
  # starved out by the next push. check-ebpf/check-full-workspace/
  # gentoo-docker-build stay as separate jobs since they're either
  # continue-on-error best-effort or meaningfully heavier/slower and don't
  # need to block fast feedback on the lightweight checks above.
  lint-test-audit:
    name: Format + Clippy + Security Audit + Test (non-eBPF crates)
    runs-on: x86_64
    container: catthehacker/ubuntu:act-latest  # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev protobuf-compiler
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true  # runner-side cache action is flaky on beauxbatons (artifactcache timeouts / module-not-found under parallel job races) -- caching is an optimization, never worth failing the job over
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            target
          key: ${{ runner.os }}-cargo-lint-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-test-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --exclude patronus-ebpf --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Generate Cargo.lock
        # Cargo.lock is gitignored and never committed in this workspace, so
        # a fresh checkout has nothing for cargo-audit to scan (it errors
        # with "Couldn't load Cargo.lock" rather than silently passing).
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
      - name: Run tests
        run: cargo test --workspace --exclude patronus-ebpf

  check-ebpf:
    name: Check eBPF crate (compile only, no run)
    runs-on: x86_64
    container: catthehacker/ubuntu:act-latest  # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install libbpf headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbpf-dev linux-headers-generic libmnl-dev libnftnl-dev libssl-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true  # runner-side cache action is flaky on beauxbatons (artifactcache timeouts / module-not-found under parallel job races) -- caching is an optimization, never worth failing the job over
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ebpf-
      - name: cargo check patronus-ebpf
        run: cargo check -p patronus-ebpf --all-targets

  check-full-workspace:
    name: Check full 48-crate workspace (best-effort)
    runs-on: x86_64
    container: catthehacker/ubuntu:act-latest  # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install libbpf headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbpf-dev linux-headers-generic libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev protobuf-compiler
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true  # runner-side cache action is flaky on beauxbatons (artifactcache timeouts / module-not-found under parallel job races) -- caching is an optimization, never worth failing the job over
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-full-
      - name: cargo check --workspace --all-targets --keep-going
        run: cargo check --workspace --all-targets --keep-going

  gentoo-docker-build:
    name: Gentoo Docker Build
    runs-on: x86_64
    container: catthehacker/ubuntu:act-latest  # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
    needs: lint-test-audit
    # Uses the prebuilt patronus-ci-base image (Portage tree pre-synced,
    # runtime deps pre-installed, Rust toolchain warm -- see
    # .forgejo/workflows/build-ci-base.yml and Dockerfile.ci-base) so this
    # job only has to emerge Patronus itself, not the whole dependency
    # graph from a bare stage3 every single run. Previously this build did
    # a full `emerge` release build (LTO=true, codegen-units=1, plus the
    # IUSE "+"-default feature set) from a bare gentoo/stage3 image and
    # never completed within a normal CI window (every run killed by the
    # runner after ~2h40m-3h). timeout-minutes/continue-on-error are kept
    # as a safety net in case the base image is ever stale/missing and it
    # falls back to a from-scratch build, but the expected path now is a
    # normal-length build.
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build Gentoo/Portage image (using prebuilt CI base if available)
        # The prebuilt base (see build-ci-base.yml) is pushed to this repo's
        # own Forgejo container registry, which isn't always reachable/enabled
        # (e.g. registry not provisioned server-side yet -> docker login/pull
        # 404s). Rather than hard-failing this job every run in that case,
        # probe for the image first and fall back to the public gentoo/stage3
        # base so the build still exercises something real.
        run: |
          BASE_IMAGE=gentoo/stage3:amd64-systemd
          if docker pull git.canutethegreat.com/canutethegreat/patronus-ci-base:latest; then
            BASE_IMAGE=git.canutethegreat.com/canutethegreat/patronus-ci-base:latest
          else
            echo "::warning::prebuilt CI base image unavailable, falling back to ${BASE_IMAGE}"
          fi
          # The emerge inside this build routinely runs 10-20+ minutes, and has
          # repeatedly failed outright with transient BuildKit/registry network
          # errors (e.g. "failed to solve: Unavailable: error reading from
          # server: EOF") well after real build progress was already made --
          # not an actual build failure, just a dropped connection mid-build.
          # Retry the whole docker build a few times with backoff before
          # giving up; BuildKit's layer cache makes a retry after a network
          # blip cheap, not a full rebuild from scratch.
          attempt=1
          max_attempts=3
          until docker build --build-arg CI_BASE_IMAGE="${BASE_IMAGE}" -t patronus/web:${{ github.sha }} .; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::docker build failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::docker build attempt ${attempt} failed (likely transient network/registry error), retrying..."
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done

      - name: Smoke-test the built image
        # patronus-web has no CLI arg parsing (no clap) and the image has no
        # ENTRYPOINT, just CMD ["patronus-web"] -- `docker run image --version`
        # therefore replaces the whole command and always fails with
        # "exec: --version: no such file or directory", regardless of whether
        # the image itself is healthy. Actually exercise the binary instead:
        # start it detached, wait for it to come up, hit its real health
        # endpoint, then tear down.
        #
        # This job's steps run inside a job container (started by the
        # Forgejo runner) that talks to the *host* docker daemon over a
        # mounted docker.sock. `docker run -d -p 8443:8443 ...` therefore
        # creates a **sibling** container on the host's default bridge
        # network, not inside this job container's own network namespace --
        # `curl http://localhost:8443/` from in here can never reach it no
        # matter how long we wait (confirmed: the app's own logs show it
        # really did start and bind 0.0.0.0:8443 within ~1s, but the 60s
        # curl-retry loop still timed out every time). Fix: launch the web
        # container sharing this job container's network namespace directly
        # (`--network container:$(hostname)`, since the job container's
        # hostname is its own container ID under Docker) so "localhost:8443"
        # resolves to the same netns the app is actually listening on; port
        # publishing (-p) is meaningless/rejected in that mode since there's
        # no separate network to publish from.
        run: |
          set -e
          cid=$(docker run -d --network "container:$(hostname)" patronus/web:${{ github.sha }})
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8443/ >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::patronus-web did not respond on :8443 within 60s"
            exit 1
          fi
          echo "patronus-web responded successfully"
