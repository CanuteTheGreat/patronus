name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (non-eBPF crates)
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - name: Run clippy
        run: cargo clippy --workspace --exclude patronus-ebpf --all-targets -- -D warnings

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        # cargo-audit itself and its build deps (libc, etc.) need a real C
        # toolchain -- this runner has nothing pre-installed. Also matches
        # the clippy/test jobs' own libelf-dev/zlib1g-dev addition: even
        # though cargo-audit only reads Cargo.lock metadata, `cargo install`
        # still resolves/builds against this workspace's full dependency
        # graph in some configurations, which can pull in libbpf-sys.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev zlib1g-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Generate Cargo.lock
        # Cargo.lock is gitignored and never committed in this workspace, so
        # a fresh checkout has nothing for cargo-audit to scan (it errors
        # with "Couldn't load Cargo.lock" rather than silently passing).
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit

  test:
    name: Test (non-eBPF crates)
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Run tests
        run: cargo test --workspace --exclude patronus-ebpf

  check-ebpf:
    name: Check eBPF crate (compile only, no run)
    runs-on: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install libbpf headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbpf-dev linux-headers-generic libmnl-dev libnftnl-dev libssl-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ebpf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ebpf-
      - name: cargo check patronus-ebpf
        run: cargo check -p patronus-ebpf --all-targets

  check-full-workspace:
    name: Check full 48-crate workspace (best-effort)
    runs-on: x86_64
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install libbpf headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libbpf-dev linux-headers-generic libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-full-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-full-
      - name: cargo check --workspace --all-targets --keep-going
        run: cargo check --workspace --all-targets --keep-going

  gentoo-docker-build:
    name: Gentoo Docker Build
    runs-on: x86_64
    needs: fmt
    # Uses the prebuilt patronus-ci-base image (Portage tree pre-synced,
    # runtime deps pre-installed, Rust toolchain warm -- see
    # .forgejo/workflows/build-ci-base.yml and Dockerfile.ci-base) so this
    # job only has to emerge Patronus itself, not the whole dependency
    # graph from a bare stage3 every single run. Previously this build did
    # a full `emerge` release build (LTO=true, codegen-units=1, plus the
    # IUSE "+"-default feature set) from a bare gentoo/stage3 image and
    # never completed within a normal CI window (every run killed by the
    # runner after ~2h40m-3h). timeout-minutes/continue-on-error are kept
    # as a safety net in case the base image is ever stale/missing and it
    # falls back to a from-scratch build, but the expected path now is a
    # normal-length build.
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build Gentoo/Portage image (using prebuilt CI base)
        run: docker build --build-arg CI_BASE_IMAGE=git.canutethegreat.com/canutethegreat/patronus-ci-base:latest -t patronus/web:${{ github.sha }} .

      - name: Smoke-test the built image
        run: docker run --rm patronus/web:${{ github.sha }} --version || docker run --rm patronus/web:${{ github.sha }} --help
