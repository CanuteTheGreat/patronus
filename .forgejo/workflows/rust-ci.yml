name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Incremental state is never reused in CI; it only costs memory and disk.
  CARGO_INCREMENTAL: 0

# Concurrency (2026-10-17, ctg-infrastructure ollivanders/forgejo/ci-supersede-sweeper):
# other branches and PRs: a new push cancels the older run. main: runs queue behind each
# other instead, so a run that has started is never cancelled by a later push, and the
# sweeper cancels superseded runs that never started (keeps the newest, plus the oldest
# while nothing in the group runs, so constant pushes can't keep main at the back of
# the shared runner queue). Forgejo 17 ignores jobs.<id>.concurrency; only this block counts.
concurrency:
  group: "latest:${{ github.workflow }}@${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # fmt/clippy/security-audit/test used to be 4 separate jobs. The only
  # forgejo-runner currently registered for the `x86_64` label (beauxbatons,
  # see .forgejo/workflows/rust-ci.yml history around 2026-10-08) has
  # capacity: 1 -- it can only execute one job at a time, full stop. With 4+
  # independent jobs all competing for that single slot, later jobs in the
  # queue routinely sat unclaimed long enough to get marked "Has been
  # cancelled" before a runner ever picked them up, especially when commits
  # were pushed in quick succession (each push adds its own 4-6 jobs to the
  # same single-slot queue). Merging these four into one sequential job
  # means the whole set only has to win the runner's one slot ONCE instead
  # of 4 times, and shares one checkout/toolchain-install/apt-get install
  # instead of paying that setup cost 4x -- both directly shrink the total
  # queued-and-running wall-clock window this work is exposed to being
  # starved out by the next push. check-ebpf/check-full-workspace/
  # gentoo-docker-build stay as separate jobs since they're either
  # continue-on-error best-effort or meaningfully heavier/slower and don't
  # need to block fast feedback on the lightweight checks above.
  lint-test-audit:
    name: Format + Clippy + Security Audit + Test (non-eBPF crates)
    # linux-any: arch-independent, served by the arm64 hosts and the x86 linux-cross slots
    # (ctg-infrastructure ci-runners); ci-rust-env.sh pins mold/sccache for both arches.
    runs-on: linux-any
    # 2026-10-09 run (commit 6dc6e08) died silently 23m35s in with no final
    # error line -- log just stops mid-clippy-compile (last line "Checking
    # patronus-sdwan") with no panic/OOM/cancellation message, while the
    # sibling check-full-workspace job (same runner, same deps, 'cargo
    # check' instead of clippy) finished clean in 4m18s right after. Root
    # cause couldn't be confirmed after the fact (beauxbatons is a shared
    # macOS dev box, runner has capacity 1, no swap -- a transient resource
    # stall on the host is the leading theory, not a code bug). Adding an
    # explicit timeout here so a repeat produces a clear 'cancelled: timeout'
    # instead of a silent unexplained failure with a dead log stream.
    timeout-minutes: 30
    # Build memory (2026-10-17, ~/.hermes/state/build-slimming/patronus.md):
    # debug = "line-tables-only" in .cargo/config.toml, mold, no incremental:
    # the workspace test build went from 20 GB of target/ (cgroup filled to
    # 11 GB with page cache, 2.8 GB anon) to 6.4 GB / 5.8 GB peak / 2.7 GB
    # anon at 4 jobs; clippy peaks at 3.4 GB. Capped at 6g.
    container:
      # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
      image: catthehacker/ubuntu:act-latest
      options: --memory 6g --memory-swap 6g --cpus 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install dependencies
        run: |
          # The runner image ships a Launchpad git-core PPA we don't install anything
          # from; a Launchpad 503 made `apt-get update` exit 100 and fail the job
          # (run 385, 2026-10-16). Drop third-party PPA lists and retry archive flakes.
          sudo rm -f /etc/apt/sources.list.d/*ppa*.list /etc/apt/sources.list.d/*ppa*.sources
          for i in 1 2 3; do sudo apt-get update && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          sudo apt-get install -y build-essential libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev protobuf-compiler
      - name: Build env (mold linker, no incremental)
        # ci/ci-rust-env.sh: pinned mold release (sha256-checked) as the
        # linker for every following step. No sccache here: a job container
        # has no persistent cache volume. RUSTFLAGS replaces the
        # target-cpu=native rustflags of .cargo/config.toml for CI builds,
        # which is fine for tests (and keeps the result host-independent).
        run: CI_NO_SCCACHE=1 CI_RUST_ENV_EXPORT=1 . ci/ci-rust-env.sh
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true  # runner-side cache action is flaky on beauxbatons (artifactcache timeouts / module-not-found under parallel job races) -- caching is an optimization, never worth failing the job over
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-lint-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-lint-test-
      - name: README claims ledger (every claim mapped to a CI-run test)
        run: ci/claims-check.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --exclude patronus-ebpf --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Generate Cargo.lock
        # Cargo.lock is gitignored and never committed in this workspace, so
        # a fresh checkout has nothing for cargo-audit to scan (it errors
        # with "Couldn't load Cargo.lock" rather than silently passing).
        run: cargo generate-lockfile
      - name: Run cargo audit
        run: cargo audit
      - name: Run tests
        run: cargo test --workspace --exclude patronus-ebpf

  privileged-netfilter-tests:
    # The nftables / raw-socket tests are #[ignore]d in the ordinary
    # unprivileged test run above (they need CAP_NET_ADMIN / CAP_NET_RAW and
    # the real `nft` binary) and used to never run in CI at all. The runner
    # drops `--cap-add` from container.options (run 388: CapEff without
    # NET_ADMIN, `nft add table` -> Operation not permitted), so
    # ci/privileged-tests.sh compiles the test binaries here and runs ONLY
    # the ignored tests in a capped sibling container that really has those
    # capabilities (and proves it first). Covers rule apply/delete error
    # propagation (a4d7bf96), the literal 'any' wildcard fix
    # (6501ee75/7bdac073), the seeded default rules really being in
    # nftables, and the SD-WAN ICMP/UDP health probes.
    name: Privileged netfilter + raw-socket tests (NET_ADMIN)
    runs-on: linux-cross-x86_64
    timeout-minutes: 40
    container:
      image: catthehacker/ubuntu:act-latest
      options: --memory 6g --memory-swap 6g --cpus 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ppa*.list /etc/apt/sources.list.d/*ppa*.sources
          for i in 1 2 3; do sudo apt-get update && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          sudo apt-get install -y build-essential libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev protobuf-compiler
      - name: Build env (mold linker, no incremental)
        # ci/ci-rust-env.sh: pinned mold release (sha256-checked) as the
        # linker for every following step. No sccache here: a job container
        # has no persistent cache volume. RUSTFLAGS replaces the
        # target-cpu=native rustflags of .cargo/config.toml for CI builds,
        # which is fine for tests (and keeps the result host-independent).
        run: CI_NO_SCCACHE=1 CI_RUST_ENV_EXPORT=1 . ci/ci-rust-env.sh
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-priv-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-priv-
      - name: Ignored real-nftables / raw-socket tests in a CAP_NET_ADMIN container
        run: ci/privileged-tests.sh

  netlab:
    # Kernel-state proof for the config store + boot apply (lane A) and the
    # later lanes: ci/netlab/run.sh builds the shipped patronus +
    # patronus-web binaries and runs ci/netlab/lane-*.sh in a capped sibling
    # container that builds its own network namespaces + veth pairs. Lane A
    # asserts `nft list ruleset`, /proc/sys and real LAN->WAN / WAN->LAN
    # traffic after API edits, a patronus-web restart and a fresh-namespace
    # `patronus apply` (= reboot), plus the fresh-box default ruleset.
    # Test-depth scenarios (ci/netlab/lib.sh harness: LAN client, router,
    # ISP, internet host with DNS+HTTP): journey-first-boot (install ->
    # online -> web UI rule -> reboot), journey-backup-restore,
    # failure-atomic-apply (rejected rules, lockdown, no nft), failure-
    # power-cut (SIGKILL mid-edit/mid-apply, 4 rounds here, 30 nightly),
    # upgrade-store (v0.1.0 store layout; previous release nightly).
    name: Netlab (network namespaces) - journeys, failure/recovery, upgrade, LAN services
    runs-on: linux-cross-x86_64
    timeout-minutes: 100
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
    container:
      image: catthehacker/ubuntu:act-latest
      options: --memory 6g --memory-swap 6g --cpus 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ppa*.list /etc/apt/sources.list.d/*ppa*.sources
          for i in 1 2 3; do sudo apt-get update && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          sudo apt-get install -y build-essential libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev protobuf-compiler libdbus-1-dev
      - name: Build env (mold linker, no incremental)
        # ci/ci-rust-env.sh: pinned mold release (sha256-checked) as the
        # linker for every following step. No sccache here: a job container
        # has no persistent cache volume. RUSTFLAGS replaces the
        # target-cpu=native rustflags of .cargo/config.toml for CI builds,
        # which is fine for tests (and keeps the result host-independent).
        run: CI_NO_SCCACHE=1 CI_RUST_ENV_EXPORT=1 . ci/ci-rust-env.sh
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-netlab-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-netlab-
      - name: Netlab tests in a capped NET_ADMIN/SYS_ADMIN container
        run: ci/netlab/run.sh
      # Lane D (LAN services): the same shipped binaries in a real Gentoo
      # stage3 with kea/dnsmasq/radvd/unbound/chrony from the binhost and the
      # shipped OpenRC scripts / systemd units; client namespaces must get
      # DHCPv4/v6 leases, see RAs, resolve overrides, be blocked by the
      # DNSBL, get NTP time, through the relay too, and it all must come
      # back after a reboot-equivalent `patronus apply`. Once per init system.
      - name: Lane D LAN services - OpenRC path (Gentoo stage3, rc-service)
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: ci/netlab/lan-services.sh openrc
      - name: Lane D LAN services - systemd path (Gentoo stage3, systemd as PID 1)
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
        run: ci/netlab/lan-services.sh systemd
      # Lanes F + H in the same Gentoo images (ci/netlab/vpn-services-test.sh):
      # an IKEv2 tunnel configured through the API of a patronus-web running
      # as user patronus (applyd as root) comes up against a second charon,
      # carries LAN <-> remote-LAN traffic both ways un-NATed, comes back
      # after a reboot-equivalent `patronus apply`; strongSwan stop/start
      # from the web API through applyd; WireGuard created by the
      # unprivileged UI. Once per init system.
      - name: Lanes F/H IPsec + service control - OpenRC path (Gentoo stage3)
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          NETLAB_TEST: vpn-services-test.sh
        run: ci/netlab/lan-services.sh openrc
      - name: Lanes F/H IPsec + service control - systemd path (Gentoo stage3)
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          NETLAB_TEST: vpn-services-test.sh
        run: ci/netlab/lan-services.sh systemd
      # Lane G in the same images (ci/netlab/ha-services-test.sh): VIPs from
      # the API become a keepalived config that negotiates VRRP with an
      # independent peer (priority 200); failover within seconds, preemption,
      # traffic via the VIP, conntrackd state sync into the peer's kernel
      # table, maintenance mode, alias VIPs, reboot, HA off. Once per init system.
      - name: Lane G high availability - OpenRC path (Gentoo stage3)
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          NETLAB_TEST: ha-services-test.sh
        run: ci/netlab/lan-services.sh openrc
      - name: Lane G high availability - systemd path (Gentoo stage3)
        env:
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          NETLAB_TEST: ha-services-test.sh
        run: ci/netlab/lan-services.sh systemd

  feature-matrix:
    # `cargo test --workspace` only ever compiles default features, so every
    # cfg(feature)-gated module (patronus-network's dhcp/dns/wireguard/
    # openvpn/ipsec/vlan/qos/multiwan/ha/ids/frr, firewall iptables/geoip,
    # sdwan cli/dataplane, secrets stores, ...) was never built or tested in
    # CI. This job (1) runs each feature-bearing crate's tests with
    # --all-features and (2) builds patronus-cli once per Gentoo USE flag ->
    # cargo feature mapping in the ebuild, so each USE flag compiles on its
    # own, not just as part of one big set.
    name: Feature matrix (all features + one build per USE flag)
    # linux-any: arch-independent, served by the arm64 hosts and the x86 linux-cross slots
    # (ctg-infrastructure ci-runners); ci-rust-env.sh pins mold/sccache for both arches.
    runs-on: linux-any
    timeout-minutes: 75
    env:
      # keep peak memory well inside the cap (the 2026-10-16 run stalled
      # on a loaded runner with no output for 45 min). Measured 2026-10-17
      # with line-tables debuginfo + mold: 5.7 GB cgroup peak (mostly page
      # cache), 1.8 GB anon, so 6g (was 8g: 11 GB / 2.1 GB anon before).
      # netlab's build 3.4 GB and the privileged tests fit 6g as well.
      CARGO_BUILD_JOBS: 4
    container:
      image: catthehacker/ubuntu:act-latest
      options: --memory 6g --memory-swap 6g --cpus 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ppa*.list /etc/apt/sources.list.d/*ppa*.sources
          for i in 1 2 3; do sudo apt-get update && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          sudo apt-get install -y build-essential libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev protobuf-compiler libdbus-1-dev
      - name: Build env (mold linker, no incremental)
        # ci/ci-rust-env.sh: pinned mold release (sha256-checked) as the
        # linker for every following step. No sccache here: a job container
        # has no persistent cache volume. RUSTFLAGS replaces the
        # target-cpu=native rustflags of .cargo/config.toml for CI builds,
        # which is fine for tests (and keeps the result host-independent).
        run: CI_NO_SCCACHE=1 CI_RUST_ENV_EXPORT=1 . ci/ci-rust-env.sh
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-features-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-features-
      - name: Tests with --all-features (feature-bearing crates)
        run: |
          set -e
          # (patronus-cli is covered by the per-USE-flag builds below, which
          # end with a full build of every USE-mapped feature together.)
          for c in patronus-network patronus-firewall patronus-core patronus-sdwan patronus-secrets; do
            echo "::group::cargo test -p $c --all-features"
            cargo test -p "$c" --all-features
            echo "::endgroup::"
          done
      - name: Build patronus-cli once per ebuild USE-flag feature
        run: ci/use-flag-feature-check.sh

  operator-k8s-tests:
    # patronus-operator's site/policy lifecycle and health-endpoint tests are
    # #[ignore]d because they need a Kubernetes API and a running operator;
    # they never ran anywhere. This job runs them for real: a capped,
    # throwaway k3s server container, CRDs generated by the operator's own
    # crdgen, the real operator binary, then `cargo test -- --ignored`.
    name: Operator tests against a real k3s cluster
    runs-on: linux-cross-x86_64
    timeout-minutes: 45
    container:
      image: catthehacker/ubuntu:act-latest
      options: --memory 6g --memory-swap 6g --cpus 4
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*ppa*.list /etc/apt/sources.list.d/*ppa*.sources
          for i in 1 2 3; do sudo apt-get update && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          sudo apt-get install -y build-essential libssl-dev pkg-config curl
          docker version
      - name: Build env (mold linker, no incremental)
        # ci/ci-rust-env.sh: pinned mold release (sha256-checked) as the
        # linker for every following step. No sccache here: a job container
        # has no persistent cache volume. RUSTFLAGS replaces the
        # target-cpu=native rustflags of .cargo/config.toml for CI builds,
        # which is fine for tests (and keeps the result host-independent).
        run: CI_NO_SCCACHE=1 CI_RUST_ENV_EXPORT=1 . ci/ci-rust-env.sh
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-operator-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-operator-
      - name: Real k3s + real operator + ignored integration tests
        run: ci/operator-k8s-tests.sh

  check-ebpf:
    name: Check eBPF crate (compile only, no run)
    runs-on: linux-cross-x86_64
    timeout-minutes: 15
    container: catthehacker/ubuntu:act-latest  # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install libbpf headers
        run: |
          # The runner image ships a Launchpad git-core PPA we don't install anything
          # from; a Launchpad 503 made `apt-get update` exit 100 and fail the job
          # (run 385, 2026-10-16). Drop third-party PPA lists and retry archive flakes.
          sudo rm -f /etc/apt/sources.list.d/*ppa*.list /etc/apt/sources.list.d/*ppa*.sources
          for i in 1 2 3; do sudo apt-get update && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          sudo apt-get install -y build-essential libbpf-dev linux-headers-generic libmnl-dev libnftnl-dev libssl-dev pkg-config
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true  # runner-side cache action is flaky on beauxbatons (artifactcache timeouts / module-not-found under parallel job races) -- caching is an optimization, never worth failing the job over
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ebpf-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ebpf-
      - name: cargo check patronus-ebpf
        run: cargo check -p patronus-ebpf --all-targets

  check-full-workspace:
    name: Check full 46-crate workspace (best-effort)
    # linux-any: arch-independent, served by the arm64 hosts and the x86 linux-cross slots
    # (ctg-infrastructure ci-runners); ci-rust-env.sh pins mold/sccache for both arches.
    runs-on: linux-any
    timeout-minutes: 20
    container: catthehacker/ubuntu:act-latest  # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
      - name: Install libbpf headers
        run: |
          # The runner image ships a Launchpad git-core PPA we don't install anything
          # from; a Launchpad 503 made `apt-get update` exit 100 and fail the job
          # (run 385, 2026-10-16). Drop third-party PPA lists and retry archive flakes.
          sudo rm -f /etc/apt/sources.list.d/*ppa*.list /etc/apt/sources.list.d/*ppa*.sources
          for i in 1 2 3; do sudo apt-get update && break; [ "$i" = 3 ] && exit 1; sleep 15; done
          sudo apt-get install -y build-essential libbpf-dev linux-headers-generic libmnl-dev libnftnl-dev libssl-dev pkg-config libelf-dev zlib1g-dev protobuf-compiler
      - name: Cache cargo
        uses: actions/cache@v4
        continue-on-error: true  # runner-side cache action is flaky on beauxbatons (artifactcache timeouts / module-not-found under parallel job races) -- caching is an optimization, never worth failing the job over
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-full-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-full-
      - name: cargo check --workspace --all-targets --keep-going
        run: cargo check --workspace --all-targets --keep-going

  gentoo-docker-build:
    name: Gentoo Docker Build
    runs-on: linux-cross-x86_64
    container: catthehacker/ubuntu:act-latest  # pin multi-arch manifest-list image to avoid a known dual-runner platform-mismatch race (one registered x86_64-labeled runner enforces linux/arm64 for its default single-platform digest image, causing instant 'docker create' failures)
    needs: lint-test-audit
    # Uses the prebuilt patronus-ci-base image (Portage tree pre-synced,
    # runtime deps pre-installed, Rust toolchain warm -- see
    # .forgejo/workflows/build-ci-base.yml and Dockerfile.ci-base) so this
    # job only has to emerge Patronus itself, not the whole dependency
    # graph from a bare stage3 every single run. Previously this build did
    # a full `emerge` release build (LTO=true, codegen-units=1, plus the
    # IUSE "+"-default feature set) from a bare gentoo/stage3 image and
    # never completed within a normal CI window (every run killed by the
    # runner after ~2h40m-3h). timeout-minutes/continue-on-error are kept
    # as a safety net in case the base image is ever stale/missing and it
    # falls back to a from-scratch build, but the expected path now is a
    # normal-length build.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free Docker disk space before the build
        # Root cause of the long-standing "ReadOnlyFileSystem: .../.ipc/lock"
        # (and cargo "error writing dependencies to .../target/release/..."
        # failures right before it) in this job: NOT a Dockerfile mount/cache
        # misconfiguration (there are no --mount=type=cache or VOLUME
        # directives in Dockerfile/Dockerfile.ci-base at all). The real cause
        # is host-level disk exhaustion on the beauxbatons runner: Docker
        # Desktop's VM disk is a thin-provisioned sparse file on the macOS
        # host's boot volume, and unpruned images/volumes/build cache had
        # grown to consume effectively all of the host's real free space
        # (confirmed live: host boot volume had single-digit GB unallocated
        # while Docker's own accounting alone held 266GB images + 125GB
        # volumes + 117GB build cache, of which only ~207GB had ever been
        # materialized as real host blocks). When this Rust build's
        # writable container layer needed the sparse VM disk to grow further
        # mid-build, macOS couldn't allocate more physical blocks, the VM's
        # guest ext4 saw that as a block-device I/O error and remounted
        # itself read-only (explaining why dozens of unrelated files failed
        # at once, all starting at the same instant) -- and the Docker
        # daemon losing its socket right after in the same run's log
        # ("failed to connect to the docker API ... no such file or
        # directory") is a direct downstream symptom of that same host-disk
        # exhaustion (the VM/daemon destabilizing under the I/O failure),
        # not a second, independent bug.
        #
        # Fix: reclaim real host disk space before every Gentoo build runs,
        # so unpruned layers/volumes/build cache from past runs (on this
        # shared, long-lived runner) can never accumulate back into this
        # state. `docker system prune` alone is not enough here, because
        # Docker Desktop's sparse VM disk does not automatically return
        # freed blocks to the host after a prune -- an explicit fstrim
        # inside the VM is required too (confirmed: a prune alone left the
        # host at ~18GB free; following it with fstrim recovered >500GB).
        run: |
          # This runner is shared with other repos' CI (rustinion, Android,
          # etc.) -- deliberately conservative here: only remove things
          # that are definitely dead weight (dangling images, build cache
          # older than an hour), never a blanket `-a`/`--volumes` prune
          # that would also nuke other projects' live caches on this box.
          docker image prune -f 2>&1 || true
          docker builder prune -f --filter until=1h 2>&1 || true
          # Reclaim the now-freed blocks from the host's actual physical
          # disk too (see comment above) -- punches holes in the
          # thin-provisioned Docker Desktop VM disk via the guest's own
          # fstrim, run from a throwaway privileged container that nsenters
          # into the VM's real (pid 1) namespace. Safe to run unconditionally:
          # fstrim only reclaims blocks the filesystem already considers
          # free, it never touches live data.
          docker run --rm --privileged --pid=host busybox:latest \
            sh -c 'nsenter --target 1 --mount --uts --ipc --net -- fstrim -av' 2>&1 || true
          df -h / 2>&1 || true

      - name: Build Gentoo/Portage image (using prebuilt CI base if available)
        # The prebuilt base (see build-ci-base.yml) is pushed to this repo's
        # own Forgejo container registry, which isn't always reachable/enabled
        # (e.g. registry not provisioned server-side yet -> docker login/pull
        # 404s). Rather than hard-failing this job every run in that case,
        # probe for the image first and fall back to the public gentoo/stage3
        # base so the build still exercises something real.
        run: |
          BASE_IMAGE=gentoo/stage3:amd64-systemd
          if docker pull git.canutethegreat.com/canutethegreat/patronus-ci-base:latest; then
            BASE_IMAGE=git.canutethegreat.com/canutethegreat/patronus-ci-base:latest
          else
            echo "::warning::prebuilt CI base image unavailable, falling back to ${BASE_IMAGE}"
          fi
          # The emerge inside this build routinely runs 10-20+ minutes, and has
          # repeatedly failed outright with transient BuildKit/registry network
          # errors (e.g. "failed to solve: Unavailable: error reading from
          # server: EOF") well after real build progress was already made --
          # not an actual build failure, just a dropped connection mid-build.
          # Retry the whole docker build a few times with backoff before
          # giving up; BuildKit's layer cache makes a retry after a network
          # blip cheap, not a full rebuild from scratch.
          attempt=1
          max_attempts=3
          # Every USE flag that maps to a cargo feature (see the ebuild's
          # myfeatures) plus dashboard, so the real emerge compiles and
          # installs all of them, not just the Dockerfile's default subset.
          USE_ALL="web cli api dashboard nftables dhcp dns unbound vpn wireguard openvpn ipsec multiwan monitoring prometheus captive-portal vlan qos backup systemd"
          until docker build --build-arg CI_BASE_IMAGE="${BASE_IMAGE}" --build-arg PATRONUS_USE="${USE_ALL}" -t patronus/web:${{ github.sha }} .; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::docker build failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "::warning::docker build attempt ${attempt} failed (likely transient network/registry error), retrying..."
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done

      - name: Smoke-test the built image
        # patronus-web has no CLI arg parsing (no clap) and the image has no
        # ENTRYPOINT, just CMD ["patronus-web"] -- `docker run image --version`
        # therefore replaces the whole command and always fails with
        # "exec: --version: no such file or directory", regardless of whether
        # the image itself is healthy. Actually exercise the binary instead:
        # start it detached, wait for it to come up, hit its real health
        # endpoint, then tear down.
        #
        # This job's steps run inside a job container (started by the
        # Forgejo runner) that talks to the *host* docker daemon over a
        # mounted docker.sock. `docker run -d -p 8443:8443 ...` therefore
        # creates a **sibling** container on the host's default bridge
        # network, not inside this job container's own network namespace --
        # `curl http://localhost:8443/` from in here can never reach it no
        # matter how long we wait (confirmed: the app's own logs show it
        # really did start and bind 0.0.0.0:8443 within ~1s, but the 60s
        # curl-retry loop still timed out every time). Fix: launch the web
        # container sharing this job container's network namespace directly
        # (`--network container:$(hostname)`, since the job container's
        # hostname is its own container ID under Docker) so "localhost:8443"
        # resolves to the same netns the app is actually listening on; port
        # publishing (-p) is meaningless/rejected in that mode since there's
        # no separate network to publish from.
        # patronus-web initializes nftables tables/chains on startup
        # (crates/patronus-web/src/main.rs -> patronus-firewall), which
        # opens a netlink socket to the kernel. Docker containers run
        # without CAP_NET_ADMIN/CAP_NET_RAW by default, so that call
        # fails with "cache initialization failed: Operation not
        # permitted" and the process exits before ever binding :8443
        # -- the 60s curl loop below was never going to succeed.
        run: |
          set -e
          cid=$(docker run -d --cap-add=NET_ADMIN --cap-add=NET_RAW --network "container:$(hostname)" patronus/web:${{ github.sha }})
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            # Dashboard serves self-signed HTTPS on 8443 (see
            # docker-compose.yml); -k skips verifying the self-signed cert.
            if curl -kfsS https://localhost:8443/ >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::patronus-web did not respond on :8443 within 60s"
            exit 1
          fi
          echo "patronus-web responded successfully"

      - name: Run the image as shipped (non-root, compose caps) - gateways, WireGuard, IPsec refusal
        # netlab runs as root / with applyd; this is the docker-compose.yml
        # setup (USER patronus, cap_add NET_ADMIN/NET_RAW, no applyd) where
        # gateway and WireGuard adds used to fail with EPERM.
        run: ci/container-as-shipped.sh patronus/web:${{ github.sha }}

      - name: Verify the ebuild install (binaries, USE flags, service files)
        run: |
          set -e
          docker run --rm --entrypoint bash patronus/web:${{ github.sha }} -c '
            set -euo pipefail
            fail() { echo "::error::$*"; exit 1; }
            for b in patronus patronus-cli patronus-web patronus-dashboard nft; do
              p=$(command -v "$b") || { ls -l /usr/bin | grep -i patronus || true; fail "binary $b not installed"; }
              echo "ok $p"
            done
            # Monitoring top connections falls back to conntrack -L on
            # kernels without /proc/net/nf_conntrack (USE=web RDEPEND), and
            # the non-root image user needs its file capability.
            ct=$(command -v conntrack) || fail "conntrack (net-firewall/conntrack-tools) not installed"
            getcap "$ct" | grep -q cap_net_admin || fail "$ct has no cap_net_admin"
            echo "ok $ct ($(getcap "$ct"))"
            for f in /usr/lib/systemd/system/patronus-dashboard.service \
                     /usr/lib/systemd/system/patronus-web.service \
                     /usr/lib/systemd/system/patronus-firewall.service \
                     /etc/patronus/patronus.toml; do
              [ -f "$f" ] || fail "missing $f"; echo "ok $f"
            done
            # Every ExecStart/ExecStop of every shipped unit must point at an
            # installed executable (they referenced /usr/bin/patronus, which
            # was never installed, so the services could not start).
            for u in /usr/lib/systemd/system/patronus-*.service; do
              for bin in $(sed -n "s/^Exec\(Start\|Stop\)=\([^ ]*\).*/\2/p" "$u"); do
                [ -x "$bin" ] || fail "$u runs $bin, which is not installed"
                echo "ok $u -> $bin"
              done
            done
            use=$(cat /var/db/pkg/net-firewall/patronus-*/USE)
            echo "installed USE: $use"
            for u in dashboard dhcp dns wireguard openvpn ipsec vlan qos multiwan captive-portal; do
              echo " $use " | grep -q " $u " || fail "USE=$u missing"
            done
            patronus --help >/dev/null
            patronus-cli --version
          '

      - name: Build the dashboard UI (frontend/ -> ./static)
        run: ./build-frontend.sh

      - name: Real 3-node HA stack e2e (election, replication, failover, haproxy TLS)
        run: ci/ha-e2e.sh patronus/web:${{ github.sha }} ./static

      - name: Publish the tested image (main only) for QA / deployments
        # Ready-to-run image = exactly the emerge-built image that just passed
        # the smoke test, install verification and HA e2e above, plus the
        # built dashboard UI baked in at /app/static. Daily QA can
        # `docker pull git.canutethegreat.com/canutethegreat/patronus:latest`
        # instead of re-emerging Gentoo from source every run.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p /tmp/pubctx && cp -r static /tmp/pubctx/static
          printf 'FROM patronus/web:%s\nCOPY --chown=patronus:patronus static /app/static\nLABEL org.opencontainers.image.revision=%s\n' \
            "${{ github.sha }}" "${{ github.sha }}" > /tmp/pubctx/Dockerfile
          docker build -t git.canutethegreat.com/canutethegreat/patronus:${{ github.sha }} \
                       -t git.canutethegreat.com/canutethegreat/patronus:latest /tmp/pubctx
          echo "${{ secrets.REGISTRY_PUSH_TOKEN }}" | docker login git.canutethegreat.com -u CanuteTheGreat --password-stdin
          # Forgejo needs 100-170 s to finalize a ~550 MB layer (it hashes the
          # blob five ways), but the docker/containerd client gives up after
          # ~30 s ("timeout awaiting response headers"). The server still
          # finishes and stores the layer; an immediate retry re-uploads the
          # same blob concurrently and Forgejo panics on the duplicate
          # package_blob row (400 / "error from registry: unknown", run 3560).
          # So wait for the in-flight finalize before retrying: the retry then
          # sees "Layer already exists" and moves on to the next large layer.
          for tag in ${{ github.sha }} latest; do
            n=1
            until docker push git.canutethegreat.com/canutethegreat/patronus:$tag; do
              [ $n -ge 6 ] && { echo "::error::push of $tag failed"; exit 1; }
              n=$((n+1)); echo "push attempt $((n-1)) failed; waiting 200s for the registry to finish storing the layer"; sleep 200
            done
          done
          docker logout git.canutethegreat.com || true

  frontend:
    # The shipped dashboard UI (frontend/, built into ./static and served by
    # every patronus-dashboard node) was never type-checked or built in CI.
    name: Dashboard UI (type-check + production build)
    # linux-any: arch-independent, served by the arm64 hosts and the x86 linux-cross slots
    # (ctg-infrastructure ci-runners); ci-rust-env.sh pins mold/sccache for both arches.
    runs-on: linux-any
    timeout-minutes: 15
    container:
      image: catthehacker/ubuntu:act-latest
      options: --memory 4g --memory-swap 4g --cpus 2
    steps:
      - uses: actions/checkout@v4
      - name: npm ci + tsc + vite build
        working-directory: frontend
        run: |
          node --version
          npm ci --no-audit --no-fund
          npm run build
          test -f ../static/index.html
          grep -l "ha/cluster" ../static/assets/*.js
