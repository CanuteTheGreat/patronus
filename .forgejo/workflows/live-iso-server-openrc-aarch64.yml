# Daily + release ISO for patronus (Gentoo live/installer; x86_64 UEFI+BIOS hybrid, aarch64 UEFI).
#
#  * schedule : build from main, QEMU boot + unattended install + reboot + web probe
#               (UEFI+USB and BIOS+CD), publish ONLY if everything passed, to the rolling
#               PRE-release `daily` (stable URL, assets replaced in place).
#  * v* tag   : same build + tests from the tag, attached to that release as a stable ISO
#               (criteria: docs/ISO-INSTALL.md "Stable ISO criteria").
#  * The job never fails on a build/test problem (a red run e-mails the owner): the result is
#    written to the `daily-status-<DE|server>-<init>-<arch>` release marker and the job summary instead.
# One job per architecture, each BUILT NATIVELY and tested under QEMU on its own runner label:
#   x86_64  kvm-x86_64  (rw-man-01 colo, /dev/kvm, host docker)  -> patronus-server-openrc-daily-x86_64.iso
#   aarch64 arm64       (rw-man-04/05 Graviton, host docker; no /dev/kvm there, so QEMU runs TCG, timeouts x3)  -> patronus-server-openrc-daily-aarch64.iso
# Image names: <product>-<desktop-env | server>-<init>-<channel>-<arch>.iso (gentoo/live-iso/common/image-name.sh; docs/ISO-INSTALL.md "Image names").
#   (riscv64 is not in the matrix: see docs/ISO-INSTALL.md "riscv64" - no native runner, no rust image)
# Each arch publishes its own asset set and its own status marker (daily-status-server-openrc-x86_64, daily-status-server-openrc-aarch64) so one failing
# arch never blocks the other. BuildKit cache mounts (binpkgs,
# distfiles, ccache, cargo target) persist on the host, so a cached daily takes minutes, not hours.
# SPLIT 2026-11-06 (queue work): one workflow per image so a 3-10 h build of one variant no longer serialises behind the others
# (the single `live-iso-<project>` group made every run wait for the previous run's SLOWEST job; no image published for 32 h).
# This file builds ONLY server-openrc-aarch64. Siblings: see the other live-iso-*.yml. Dispatch inputs: `mode` (daily|dry); `only` is gone.
# Concurrency: per variant + event + mode + ref. A newer dispatch of the same variant/mode/ref cancels the older one (superseded);
# the scheduled daily and v* tag runs are never cancelled by a dispatch (their group differs), tag groups are per tag.
name: Live ISO (server-openrc-aarch64)

on:
  # Event-driven (2026-11-06): build + test + publish the daily when main changes anything the image is built from
  # (app source, gentoo/); docs/site-only pushes do not build. v* tags still build the stable ISO.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/**'
      - 'frontend/**'
      - 'operator/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'gentoo/**'
      - '.forgejo/workflows/live-iso-server-openrc-aarch64.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily (publish to the rolling pre-release) or dry (build + test only)'
        required: false
        default: 'dry'

# Per variant + event + mode + ref. A burst of main pushes = ONE build: the sweeper (replace: group) keeps started runs and only the NEWEST
# unstarted one. A started build is never cancelled by a push (starvation under constant pushes); the next queued build then starts at once.
# A newer dispatch of the same variant still cancels the older dispatch.
concurrency:
  group: "replace:live-iso-server-openrc-aarch64-${{ github.event_name }}-${{ github.event.inputs.mode }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  live-iso:
    name: Build + test + publish live ISO (server-openrc-aarch64)
    runs-on: nightly-arm64   # heavy on-demand lane: 8 h runner timeout (TCG matrix 4+ h; per-push arm64 runners cancel at 3 h)
    container: catthehacker/ubuntu:act-latest
    timeout-minutes: 420   # was 178 (the old 3 h arm64 runner cap): on nightly-arm64 (8 h runner timeout) the TCG matrix incl. the ZFS-default install (installer-finished waits up to 5100 s) needs ~4-5 h; at 178 the job was cancelled with 'context deadline exceeded' copying SUMMARY.md (runs 8653, 9060). Stays under the 8 h runner limit.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build, test, publish
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}   # public GitHub mirror release (second publish step)
          ARCH: aarch64
          JOBS: '4'
          SYNC_MODE: '--upstream'
        run: |
          set -u
          case "${GITHUB_REF_TYPE:-}" in
            tag) mode=stable ;;
            *)   mode=daily ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ github.event.inputs.mode }}" != daily ]; then
            # dry run: no token => nothing is published
            FORGEJO_TOKEN= bash gentoo/live-iso/common/ci-run.sh "$mode"
          else
            bash gentoo/live-iso/common/ci-run.sh "$mode"
          fi
