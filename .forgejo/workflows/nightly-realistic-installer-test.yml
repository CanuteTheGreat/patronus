name: Nightly Realistic Installer Test

# Runs the REAL patronus-install binary end-to-end inside a throwaway x86_64
# QEMU/KVM VM: real GPT partitioning of a real virtual disk, a real
# `zpool create` for the ZFS root, GRUB on the ESP, then a cold boot of the
# installed disk with the install media removed. Not just a compile/clippy
# check like rust-ci.yml. Everything lives in ci/nightly-installer-test/
# (run.sh is the single entry point, also usable for local reproduction on
# any x86_64 host with /dev/kvm - see its header).
#
# Runs on kvm-x86_64: rw-man-01's dedicated VM-test runner, the one CI host
# with hardware virtualization (ctg-infrastructure ci-runners/rw-man-kvm).
# History: until 2026-10-16 this ran under UTM on beauxbatons (Apple Silicon),
# where an x86_64 guest under TCG never finished booting and the schedule was
# paused; on KVM the live system is up in ~25 s and the whole install + reboot
# cycle takes ~6 min.
#
# Deliberately separate from rust-ci.yml: nightly / on demand, not every push.
on:
  workflow_dispatch: {}
  # First green KVM run: run 3548 / job 17299 (2026-10-16).
  schedule:
    - cron: '0 9 * * *' # ~02:00 America/Los_Angeles

env:
  CARGO_TERM_COLOR: always

jobs:
  vm-install-test:
    name: Real VM install + ZFS + reboot test (QEMU/KVM)
    runs-on: kvm-x86_64
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build installer + unattended media, install + reboot a real VM under KVM
        run: ci/nightly-installer-test/run.sh
