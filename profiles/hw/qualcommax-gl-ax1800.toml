# Hardware profile: GL.iNet GL-AX1800 "Flint" (Qualcomm IPQ6018, 4x Cortex-A53, 512 MB RAM, 128 MiB SPI-NAND, ath11k Wi-Fi 6)
# See docs/embedded-routers.md section 7. Role: wired access point (dumb AP: every port bridged, no DHCP/DNS server).
# Image tooling: ci/embedded-aarch64/ax1800/ (assemble.sh, nand-budget.sh, qemu-gate.sh); CI: .forgejo/workflows/embedded-aarch64.yml.
# Format: docs/hardware-support.md (schema 1). Read by ci/hw-profile/hwprofile.py; the ax1800 scripts take the board id,
# hostname, stock image and NAND layout from here.
schema      = 1
tier        = "embedded"
arch        = "arm64"
libc        = "musl"
chost       = "aarch64-unknown-linux-musl"
ram_mb      = 512
flash_mb    = 128                    # SPI-NAND, 2048+64 B pages, 128 KiB blocks; one UBI device on mtd "rootfs"
init        = ["openrc", "systemd"]  # both first-class; busybox only provides applets (patronus-init is the shared early boot)
rootfs      = "squashfs-xz+overlayfs"   # /etc, /var/lib, /root are overlays on the UBIFS settings volume (patronus_data)

# One multi-call binary (patronus-web is a link): native aarch64 musl, stable toolchain, no build-std.
[cargo.cli]
package  = "patronus-cli"
features = ["nftables", "cli", "dhcp-server", "dns-server", "uci-import", "wifi-ap", "web-multicall"]
target   = "aarch64-unknown-linux-musl"
toolchain = "stable"

use         = ["-ebpf", "-nls", "-doc", "-python", "nftables", "hostapd", "pam"]
# The stock OpenWrt FIT (kernel + this board's device tree) is reused byte for byte; its kmods and the IPQ6018 firmware too.
kernel      = { source = "openwrt-tag-rebuilt-fit", version = "6.12.118", dts = "ipq6000-gl-ax1800" }

[web]
mode            = "on"
https_port      = 443
http_redirect   = 80
password        = "first-run"        # NO shipped password: /first-run page until the owner sets one
tls             = "self-signed"
argon2_mem_kib  = 8192
cloud_dependency = "none"

[wifi]
radios          = 2                  # one ath11k_ahb device, a 2.4 GHz and a 5 GHz phy
fast_transition = false              # 802.11r is never enabled by default or imported: it crashes the ath11k firmware on this SoC

# ---- schema 1: read by the image tooling (ci/embedded-aarch64/ax1800/*.sh) ----
[device]
id             = "glinet-gl-ax1800"
vendor         = "GL.iNet"
model          = "GL-AX1800"
variant        = ""
openwrt_board  = "glinet,gl-ax1800"      # the sysupgrade/fwtool board id (device tree compatible)
board_aliases  = ["glinet,ax1800"]       # also listed in OpenWrt's supported_devices for this board
hostname       = "ax1800"

[openwrt]
release        = "25.12.6"
target         = "qualcommax"
subtarget      = "ipq60xx"
arch_packages  = "aarch64_cortex-a53"
kernel         = "6.12.118"
# sha256 of the stock sysupgrade image (its FIT kernel, kmods and firmware are reused unchanged); from OpenWrt's sha256sums
stock_sha256   = "a6bdc66e41944717e7dc4667a937b0af127b940755b12409822cf675e9c7129f"

# NAND/UBI layout, verified against OpenWrt's factory.ubi (ci/embedded-aarch64/ax1800/ubi-layout.py, docs section 7)
[nand]
ubi_mtd_bytes  = 120586240   # mtd "rootfs" at 0xa00000, size 0x7300000 = 920 PEBs (ipq6000-gl-ax1800.dts)
chip_pebs      = 1024        # 128 MiB chip: UBI's bad-block reserve is 20 per 1024 PEBs of the whole chip
peb_bytes      = 131072
leb_bytes      = 126976      # PEB - EC header page - VID header page (min I/O 2048, VID header at 2048, data at 4096)
min_io         = 2048
reserved_pebs  = 24          # 2 layout volume + 1 wear-levelling + 1 atomic LEB change + 20 bad-block reserve
data_min_kib   = 16384       # the settings volume (patronus_data) must keep at least this
margin_kib     = 8192        # must stay free for growth between releases

[status]
level          = "builds"
evidence       = "CI builds OpenRC and systemd images (sysupgrade tar, factory.ubi, factory.bin), NAND budget, QEMU aarch64 userland gate; not yet flashed on a real unit"
