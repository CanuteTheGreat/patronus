[package]
name = "patronus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "patronus-cli"
path = "src/main.rs"

[features]
default = ["web", "cli", "nftables", "vlan", "pppoe", "dhcpcd", "dhcp-server", "dns-server", "ntp-server", "multiwan", "vpn-wireguard", "vpn-ipsec", "totp", "gitops", "ha", "qos", "syslog", "netflow", "igmp", "nat64", "l2tp", "vpn-openvpn", "upnp", "web-proxy", "intrusion-detection", "dynamic-routing", "sdwan-edge"]

# Core features
web = ["patronus-web", "dep:axum"]
# The `patronus` binary IS the CLI: it always parses arguments with clap,
# so clap is not optional (USE=-cli used to make the emerge fail to compile).
cli = []
api = []

# Firewall backends
nftables = ["patronus-firewall/nftables"]
iptables = ["patronus-firewall/iptables"]

# Network services
# LAN services (lane D): appliers in patronus apply/applyd, and the web
# UI's DHCP / DNS / NTP pages. USE=dhcp / dns,unbound,dnsmasq / ntp.
dhcp-server = ["patronus-network/dhcp", "patronus-web?/dhcp"]
dns-server = ["patronus-network/dns", "patronus-web?/dns"]
ntp-server = ["patronus-network/ntp", "patronus-web?/ntp"]
multiwan = ["patronus-network/multiwan"]

# VPN
# Lane F: WireGuard tunnels / IPsec (strongSwan swanctl) appliers in
# patronus apply/applyd and the web UI's VPN forms. USE=wireguard / ipsec.
vpn-wireguard = ["patronus-network/wireguard", "patronus-web?/wireguard"]
vpn-openvpn = ["patronus-network/openvpn", "patronus-web?/openvpn"]
vpn-ipsec = ["patronus-network/ipsec", "patronus-web?/ipsec"]
# Lane G: keepalived VRRP virtual IPs + conntrackd state sync (USE=ha).
ha = ["patronus-network/ha", "patronus-web?/ha"]
# Lane H: TOTP two-factor login for web accounts (USE=totp).
totp = ["patronus-web?/totp"]

# Monitoring
monitoring = []
monitoring-prometheus = ["dep:prometheus"]

# Advanced
captive-portal = []
ids-suricata = []
vlan = ["patronus-network/vlan", "patronus-web?/vlan"]
pppoe = ["patronus-network/pppoe", "patronus-web?/pppoe"]
dhcpcd = ["patronus-network/dhcpcd", "patronus-web?/dhcpcd"]
qos = ["patronus-network/qos", "patronus-web?/qos"]
# Feature pages (patronus-network svc.rs): USE flags of the same name
syslog = ["patronus-network/syslog", "patronus-web?/syslog"]
netflow = ["patronus-network/netflow", "patronus-web?/netflow"]
igmp = ["patronus-network/igmp", "patronus-web?/igmp"]
nat64 = ["patronus-network/nat64", "patronus-web?/nat64"]
l2tp = ["patronus-network/l2tp", "patronus-web?/l2tp"]
upnp = ["patronus-network/upnp", "patronus-web?/upnp"]
web-proxy = ["patronus-network/web-proxy", "patronus-web?/web-proxy"]
intrusion-detection = ["patronus-network/intrusion-detection", "patronus-web?/intrusion-detection"]
dynamic-routing = ["patronus-network/dynamic-routing", "patronus-web?/dynamic-routing"]
sdwan-edge = ["patronus-network/sdwan-edge", "patronus-web?/sdwan-edge", "dep:reqwest"]
backup = []

# Revolutionary features
gitops = ["patronus-gitops"]
ai = ["patronus-ai"]
kubernetes = ["patronus-cni"]

[dependencies]
patronus-core = { path = "../patronus-core" }
patronus-firewall = { path = "../patronus-firewall" }
patronus-network = { path = "../patronus-network" }
patronus-config = { path = "../patronus-config" }
patronus-web = { path = "../patronus-web", optional = true, default-features = false }
patronus-gitops = { path = "../patronus-gitops", optional = true }
patronus-ai = { path = "../patronus-ai", optional = true }
patronus-cni = { path = "../patronus-cni", optional = true }
reqwest = { workspace = true, optional = true }

# SD-WAN modules
patronus-sdwan = { path = "../patronus-sdwan" }
patronus-mpls = { path = "../patronus-mpls" }
patronus-geodns = { path = "../patronus-geodns" }
patronus-saas = { path = "../patronus-saas" }
patronus-dashboard = { path = "../patronus-dashboard" }
patronus-captiveportal = { path = "../patronus-captiveportal" }

tokio.workspace = true
clap = { workspace = true, features = ["derive"] }
axum = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx.workspace = true
serde_yaml = "0.9"
toml.workspace = true
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
comfy-table = "7.1"

[target.'cfg(unix)'.dependencies]
# restore_default_sigpipe() in main.rs
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
