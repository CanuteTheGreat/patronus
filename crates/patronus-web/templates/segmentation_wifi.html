<script>
    // ---- Wi-Fi tab: networks, devices with their own passphrase -------------------
    let WIFI = null;
    const IS_ADMIN = {% if is_admin %}true{% else %}false{% endif %};

    function wifiCard(html) { const d = document.createElement('div'); d.innerHTML = html; return d; }
    async function wifiLoad() {
        const d = await api('GET', '/api/segmentation/wifi'); if (!d) return;
        WIFI = d; wifiRender();
    }
    function wifiEl() { return document.getElementById('seg-wifi'); }
    function mk(tag, props, ...kids) {
        const e = document.createElement(tag);
        for (const k in (props || {})) { if (k === 'text') e.textContent = props[k]; else if (k === 'onclick') e.onclick = props[k]; else if (k === 'class') e.className = props[k]; else e.setAttribute(k, props[k]); }
        for (const c of kids) if (c) e.appendChild(c);
        return e;
    }
    function field(label, input) { const l = document.createElement('label'); l.textContent = label; l.appendChild(input); return l; }
    function sel(name, values, cur) { const s = document.createElement('select'); s.name = name; for (const v of values) { const o = document.createElement('option'); o.value = v; o.textContent = v; s.appendChild(o); } if (cur) s.value = cur; return s; }
    function inp(name, ph, val, req) { const i = document.createElement('input'); i.name = name; if (ph) i.placeholder = ph; if (val !== undefined) i.value = val; if (req) i.required = true; return i; }

    // ---- automatic channel: why this channel, history, settings ---------------------
    const CHAN_FIELDS = [
        ['chanlist', 'Candidate channels (empty = the band default)', 'text'],
        ['width', 'Width (MHz: 20, 40; 80 and 160 on 5/6 GHz; 320 on 6 GHz, Wi-Fi 7)', 'number'],
        ['recheck_time', 'Nightly re-check at (HH:MM, empty = never)', 'text'],
        ['hysteresis', 'Move only if better by this many % ...', 'number'],
        ['min_gain', '... and by this many score points', 'number'],
        ['confirm', 'Samples that must agree before a move', 'number'],
        ['confirm_gap', 'Seconds between those samples', 'number'],
        ['csa', 'Channel switch announcement (auto or off = restart instead)', 'text'],
        ['csa_count', 'Beacons the switch is announced for', 'number'],
        ['rounds', 'Scans of each channel per sample', 'number'],
        ['dwell', 'Milliseconds of each scan', 'number'],
        ['bss_cost', 'Score points per neighbouring access point', 'number'],
        ['min_signal', 'Ignore neighbours weaker than (dBm)', 'number'],
        ['history', 'History entries kept', 'number'],
    ];
    // ---- Wi-Fi generation (docs/WIFI-MODERN.md): what the radio supports, limited pickers ----------
    const STD_NAMES = {auto: 'automatic (newest the radio and hostapd support)', n: 'Wi-Fi 4 (802.11n)', ac: 'Wi-Fi 5 (802.11ac)', ax: 'Wi-Fi 6/6E (802.11ax)', be: 'Wi-Fi 7 (802.11be)'};
    const BAND_NAMES = {'2g': '2.4 GHz', '5g': '5 GHz', '6g': '6 GHz'};
    function radioOf(st, ifname) { return (st.radios || []).find(r => (r.ifaces || []).includes(ifname)); }
    function offerOf(st, ifname, band) { const r = radioOf(st, ifname); return r ? (r.offer || []).find(o => o.band === band) : null; }
    function optSel(name, opts, cur) { // opts: [[value, label, disabled]]
        const s = document.createElement('select'); s.name = name;
        for (const [v, l, dis] of opts) { const o = document.createElement('option'); o.value = v; o.textContent = l; if (dis) o.disabled = true; s.appendChild(o); }
        if (cur !== undefined && opts.some(x => String(x[0]) === String(cur) && !x[2])) s.value = String(cur);
        return s;
    }
    function radiosPanel(root, st) {
        const radios = st.radios || [];
        root.appendChild(mk('h3', {text: 'Radios'}));
        if (!radios.length) { root.appendChild(mk('p', {class: 'empty', text: 'No Wi-Fi radio found on this router.'})); return; }
        const h = st.hostapd || {};
        if (st.hostapd_installed !== false) root.appendChild(mk('div', {class: 'seg-note', id: 'wifi-hostapd', text: 'hostapd ' + (h.version || '') + ': Wi-Fi 6 ' + (h.ax ? 'yes' : 'no (built without CONFIG_IEEE80211AX)') + ', Wi-Fi 7 ' + (h.be ? 'yes' : 'no (needs hostapd 2.11+ with CONFIG_IEEE80211BE)') + ', multi-link ' + (h.mld ? 'yes' : 'no') + '.'}));
        const t = mk('table', {class: 'lan', id: 'seg-wifi-radios-table'});
        t.appendChild(mk('thead', {}, (() => { const tr = document.createElement('tr'); for (const x of ['Radio', 'Interfaces', 'Supports', 'Bands an access point can use']) tr.appendChild(mk('th', {text: x})); return tr; })()));
        const b = document.createElement('tbody');
        for (const r of radios) {
            const tr = document.createElement('tr');
            tr.appendChild(mk('td', {class: 'mono', text: r.phy}));
            tr.appendChild(mk('td', {text: (r.ifaces || []).join(', ') || '(no interface)'}));
            tr.appendChild(mk('td', {class: 'wifi-supports', text: (r.supports || []).join(' · ')}));
            const bd = document.createElement('td');
            for (const o of (r.offer || [])) {
                const line = mk('div', {text: BAND_NAMES[o.band] + ': ' + (o.ap ? 'up to ' + STD_NAMES[o.max_standard] + ', ' + Math.max(...o.widths) + ' MHz' : 'not available: ' + o.reason)});
                if (!o.ap) line.className = 'warn';
                bd.appendChild(line);
            }
            tr.appendChild(bd); b.appendChild(tr);
        }
        t.appendChild(b); root.appendChild(mk('div', {class: 'seg-wrap'}, t));
    }
    // band / generation / width pickers of one radio, kept consistent with each other and with what it supports
    function genPickers(f, st, ifIn, cur, notes) {
        const wrap = mk('div', {class: 'wifi-gen-pickers'});
        const note = mk('div', {class: 'seg-note', id: 'wifi-gen-note'});
        const render = () => {
            const keep = {band: (f.elements['band'] || {}).value || cur.band, standard: (f.elements['standard'] || {}).value || cur.standard, width: (f.elements['width'] || {}).value || cur.width};
            wrap.innerHTML = '';
            const r = radioOf(st, ifIn.value);
            const offers = r ? (r.offer || []) : [];
            const bands = offers.length ? offers.map(o => [o.band, BAND_NAMES[o.band] + (o.ap ? '' : ' (not available)'), !o.ap]) : [['2g', '2.4 GHz'], ['5g', '5 GHz'], ['6g', '6 GHz']];
            const bs = optSel('band', bands, keep.band); wrap.appendChild(field('Band', bs));
            const o = offers.find(x => x.band === bs.value);
            const stds = [['auto', STD_NAMES.auto]].concat((o ? o.standards : ['n', 'ac', 'ax', 'be']).map(x => [x, STD_NAMES[x]]));
            const ss = optSel('standard', stds, keep.standard); wrap.appendChild(field('Wi-Fi generation', ss));
            const widths = o ? o.widths : [20, 40, 80, 160, 320];
            const ws = optSel('width', widths.map(w => [w, w + ' MHz']), keep.width); wrap.appendChild(field('Channel width', ws));
            note.textContent = r ? ('This radio supports: ' + (r.supports || []).join(' · ') + '.') : 'This interface is not a known radio: every choice is offered, the router checks it when the network starts.';
            if (bs.value === '6g') {
                note.textContent += ' ' + notes.six_ghz;
                const sec = f.elements['security']; if (sec) { sec.value = 'wpa3'; for (const opt of sec.options) opt.disabled = opt.value !== 'wpa3'; }
            } else { const sec = f.elements['security']; if (sec) for (const opt of sec.options) opt.disabled = false; }
            bs.onchange = render; ss.onchange = render;
        };
        ifIn.addEventListener('change', render);
        f.appendChild(wrap); f.appendChild(note);
        return render;
    }
    const GEN_FIELDS = [
        ['bss_color', 'BSS colour (1-63, 0 = automatic)', 'number'],
        ['discovery', '6 GHz discovery frames (auto, probe, fils, off)', 'text'],
        ['discovery_interval', 'Discovery interval (time units, 1-20)', 'number'],
        ['mlo_links', 'Wi-Fi 7 multi-link: extra links band/channel/width (e.g. 6g/37/320), empty = one link', 'text'],
        ['mlo_wait', 'Seconds the links get to come up before falling back to one link', 'number'],
    ];
    function genBox(box, run) {
        const g = run && run.generation; if (!g) return;
        if (g.error) { box.appendChild(mk('div', {class: 'seg-note warn wifi-gen-error', text: 'Not running: ' + g.error})); return; }
        box.appendChild(mk('div', {class: 'wifi-gen', text: 'Runs ' + g.standard_name + ' at ' + g.width + ' MHz' + (g.links && g.links.length ? ', multi-link with ' + g.links.map(l => BAND_NAMES[l.band] + ' ' + l.channel + '/' + l.width).join(', ') : '') + (g.bss_color ? ', BSS colour ' + g.bss_color : '') + (g.discovery ? ', 6 GHz discovery by ' + g.discovery.kind : '') + '.'}));
        for (const w of (g.warnings || [])) box.appendChild(mk('div', {class: 'seg-note warn', text: w}));
        for (const n of (g.notes || [])) box.appendChild(mk('div', {class: 'seg-wide', text: n}));
    }
    function chanPanels(root, d, st) {
        for (const n of d.networks) {
            const run = (st.networks || []).find(x => x.network === n.name);
            const info = (d.channels || {})[String(n.id)];
            const box = mk('div', {class: 'seg-note', id: 'wifi-chan-' + n.id});
            box.appendChild(mk('strong', {text: n.name + ': ' + (n.channel === 'auto' ? 'automatic channel' : 'fixed channel ' + n.channel)}));
            const c = run && run.channel ? run.channel : null;
            genBox(box, run);
            if (n.channel === 'auto') {
                const sx = info && info.state;
                box.appendChild(mk('div', {text: 'On channel ' + ((c && c.channel) || (sx && sx.channel) || '?') + ' at ' + (n.width + ' MHz') + '. ' + ((sx && sx.reason) || 'Not measured yet: it is measured when the radio starts.')}));
                if (c) box.appendChild(mk('div', {text: 'Moves by: ' + c.csa + (c.recheck ? '. Nightly re-check at ' + c.recheck_time + (c.last_check ? ', last ' + new Date(c.last_check * 1000).toLocaleString() : '') : '. No nightly re-check.')}));
                if (sx && sx.candidates && sx.candidates.length) {
                    const t = mk('table', {class: 'lan'});
                    t.appendChild(mk('thead', {}, (() => { const tr = document.createElement('tr'); for (const h of ['Channel', 'Score (lower is better)', 'Busy %', 'Other access points']) tr.appendChild(mk('th', {text: h})); return tr; })()));
                    const tb = document.createElement('tbody');
                    for (const x of sx.candidates) { const tr = document.createElement('tr'); for (const v of [x.channel, x.score, x.busy, x.neighbours]) tr.appendChild(mk('td', {text: String(v)})); tb.appendChild(tr); }
                    t.appendChild(tb); box.appendChild(mk('div', {class: 'seg-wrap'}, t));
                }
                const det = mk('details'); det.appendChild(mk('summary', {text: 'History (' + ((info && info.history) || []).length + ')'}));
                const ul = document.createElement('ul');
                for (const h of ((info && info.history) || [])) ul.appendChild(mk('li', {text: new Date(h.at * 1000).toLocaleString() + '  ' + h.event + (h.channel ? ' ch ' + h.channel : '') + ': ' + h.reason}));
                det.appendChild(ul); box.appendChild(det);
            }
            if (CAN_MODIFY) {
                if (n.channel === 'auto') box.appendChild(btn('Re-check now', '', async () => { const r = await segCall('POST', '/api/segmentation/wifi/networks/' + n.id + '/recheck-channel'); if (r) { alert('Re-check requested: it runs within seconds and takes a few minutes. Open this page again to see the result.'); wifiLoad(); } }));
                box.appendChild(btn('Channel and generation settings', '', () => chanForm(box, n)));
            }
            root.appendChild(box);
        }
    }
    function chanForm(box, n) {
        if (box.querySelector('form')) return;
        const f = document.createElement('form'); f.className = 'lan-form';
        f.appendChild(field('Channel (auto or a number)', inp('channel', 'auto', String(n.channel))));
        const sec = sel('security', ['wpa2', 'wpa2_wpa3', 'wpa3'], n.security); f.appendChild(field('Security', sec));
        const ifIn = inp('ifname', '', n.ifname); ifIn.type = 'hidden'; f.appendChild(ifIn);
        const st = (WIFI && WIFI.status) || {};
        genPickers(f, st, ifIn, {band: n.band, standard: n.standard, width: n.width}, WIFI.notes)();
        for (const [k, label, type] of CHAN_FIELDS.filter(x => x[0] !== 'width').concat(GEN_FIELDS)) { const i = inp(k, '', n[k]); if (type === 'number') i.type = 'number'; f.appendChild(field(label, i)); }
        const rc = document.createElement('input'); rc.type = 'checkbox'; rc.name = 'recheck'; rc.checked = !!n.recheck; f.appendChild(field('Re-check every night', rc));
        f.appendChild(mk('button', {class: 'btn btn-primary', type: 'submit', text: 'Save channel settings'}));
        f.onsubmit = async (ev) => {
            ev.preventDefault();
            const b = {name: n.name, ifname: n.ifname, ssid: n.ssid, band: f.elements['band'].value, country: n.country, security: f.elements['security'].value, segment: n.segment, unknown_policy: n.unknown_policy, enabled: n.enabled, standard: f.elements['standard'].value, width: Number(f.elements['width'].value)};
            const ch = f.elements['channel'].value.trim(); b.channel = (ch === 'auto' || ch === '') ? 'auto' : Number(ch);
            for (const [k, , type] of CHAN_FIELDS.filter(x => x[0] !== 'width').concat(GEN_FIELDS)) { const v = f.elements[k].value; b[k] = type === 'number' ? Number(v) : v; }
            b.recheck = f.elements['recheck'].checked;
            const r = await segCall('PUT', '/api/segmentation/wifi/networks/' + n.id, b); if (r) wifiLoad();
            return false;
        };
        box.appendChild(f);
    }

    function wifiRender() {
        const root = wifiEl(); root.innerHTML = '';
        const d = WIFI, st = d.status || {};
        if (st.hostapd_installed === false) root.appendChild(mk('div', {class: 'seg-note warn', text: 'hostapd is not installed on this router (emerge net-wireless/hostapd). Networks can be configured but the access point will not start.'}));
        root.appendChild(mk('div', {class: 'seg-note', text: d.notes.wpa2 + ' ' + d.notes.pending}));
        root.appendChild(mk('div', {class: 'seg-note warn', text: d.notes.wpa3 + ' ' + d.notes.random_mac}));

        // issued secret (shown once)
        root.appendChild(mk('div', {id: 'wifi-issued'}));

        radiosPanel(root, st);
        root.appendChild(mk('h3', {text: 'Networks'}));
        const nt = mk('table', {class: 'lan', id: 'seg-wifi-networks-table'});
        nt.appendChild(mk('thead', {}, (() => { const tr = document.createElement('tr'); for (const h of ['Name', 'SSID', 'Radio', 'Band / channel', 'Security', 'Unknown devices', 'State', '']) tr.appendChild(mk('th', {text: h})); return tr; })()));
        const nb = document.createElement('tbody');
        const radios = (st.radios || []);
        for (const n of d.networks) {
            const run = (st.networks || []).find(x => x.network === n.name);
            const tr = document.createElement('tr');
            const liveCh = run && run.channel ? run.channel.channel : null;
            const chText = n.channel === 'auto' ? 'auto' + (liveCh ? ' (channel ' + liveCh + ')' : ' (not measured yet)') : String(n.channel);
            const g = run && run.generation;
            const genText = g && !g.error ? ', ' + g.standard_name.split(' (')[0] + ', ' + g.width + ' MHz' : '';
            for (const v of [n.name, n.ssid, n.ifname, (BAND_NAMES[n.band] || n.band) + ' / ' + chText + genText, n.security, n.unknown_policy]) {
                const td = mk('td', {text: v});
                if (v === n.security && n.restart_on_credential_change) td.appendChild(mk('span', {class: 'seg-wide', text: ' (credential changes restart the Wi-Fi)'}));
                tr.appendChild(td);
            }
            const sc = document.createElement('td');
            sc.appendChild(badge(!n.enabled ? 'disabled' : (run && run.running ? 'running' : 'stopped'), run && run.running ? 'on' : 'off'));
            if (run && run.stations) sc.appendChild(document.createTextNode(' ' + run.stations.filter(x => x.authorized).length + ' station(s)'));
            tr.appendChild(sc);
            const ac = document.createElement('td');
            if (CAN_MODIFY) {
                if (n.unknown_policy === 'enrol') {
                    ac.appendChild(btn('New enrolment secret', '', () => wifiAct('POST', '/api/segmentation/wifi/networks/' + n.id + '/enrol-secret/rotate', null, 'Enrolment secret')));
                    if (IS_ADMIN) ac.appendChild(btn('Show enrolment secret', '', () => wifiAct('POST', '/api/segmentation/wifi/networks/' + n.id + '/enrol-secret/reveal', null, 'Enrolment secret')));
                }
                ac.appendChild(btn('Delete', 'danger', () => { if (confirm('Delete the network ' + n.name + '? Its devices lose their Wi-Fi credentials.')) segCall('DELETE', '/api/segmentation/wifi/networks/' + n.id).then(wifiLoad); }));
            }
            tr.appendChild(ac); nb.appendChild(tr);
        }
        nt.appendChild(nb);
        const nw = mk('div', {class: 'seg-wrap'}, nt); root.appendChild(nw);
        chanPanels(root, d, st);
        if (!d.networks.length) root.appendChild(mk('p', {class: 'empty', text: 'No Wi-Fi network yet. Add one below (a radio that supports AP mode and a bridge to join).'}));
        if (CAN_MODIFY) {
            const f = document.createElement('form'); f.className = 'lan-form';
            const radioNames = []; for (const r of radios) for (const i of r.ifaces) radioNames.push(i);
            const ifIn = inp('ifname', radioNames[0] || 'wlan0', radioNames[0] || '', true);
            if (radioNames.length) ifIn.setAttribute('list', 'seg-radios');
            const dl = document.createElement('datalist'); dl.id = 'seg-radios'; for (const r of radioNames) { const o = document.createElement('option'); o.value = r; dl.appendChild(o); }
            f.appendChild(field('Name', inp('name', 'home', undefined, true)));
            f.appendChild(field('SSID', inp('ssid', 'HomeNet', undefined, true)));
            f.appendChild(field('Radio interface', ifIn)); f.appendChild(dl);
            f.appendChild(field('Security', sel('security', ['wpa2', 'wpa2_wpa3', 'wpa3'], 'wpa2')));
            genPickers(f, st, ifIn, {band: '2g', standard: 'auto', width: 20}, d.notes)();
            f.appendChild(field('Channel (auto or a number)', inp('channel', 'auto', 'auto')));
            f.appendChild(field('Country', inp('country', 'US', 'US')));
            const segSel = document.createElement('select'); segSel.name = 'segment'; for (const s of (SEG ? SEG.segments : [])) { const o = document.createElement('option'); o.value = s.segment; o.textContent = s.segment; segSel.appendChild(o); }
            f.appendChild(field('Joins segment (bridge)', segSel));
            f.appendChild(field('Unknown devices', sel('unknown_policy', ['reject', 'enrol'], 'reject')));
            f.appendChild(mk('button', {class: 'btn btn-primary', type: 'submit', text: 'Add network'}));
            f.onsubmit = async (ev) => { ev.preventDefault(); const b = formBody(f); if (b.channel && b.channel !== 'auto') b.channel = Number(b.channel); if (b.width) b.width = Number(b.width); const r = await segCall('POST', '/api/segmentation/wifi/networks', b); if (r) wifiLoad(); return false; };
            root.appendChild(f);
        }

        // devices with a Wi-Fi credential
        root.appendChild(mk('h3', {text: 'Devices and passphrases'}));
        const ct = mk('table', {class: 'lan', id: 'seg-wifi-creds-table'});
        ct.appendChild(mk('thead', {}, (() => { const tr = document.createElement('tr'); for (const h of ['Device', 'Network', 'Kind', 'State', 'Expires', '']) tr.appendChild(mk('th', {text: h})); return tr; })()));
        const cb = document.createElement('tbody');
        for (const c of d.credentials) {
            const tr = document.createElement('tr');
            tr.appendChild(mk('td', {text: c.device})); tr.appendChild(mk('td', {text: c.network})); tr.appendChild(mk('td', {text: c.kind}));
            const sc = document.createElement('td'); sc.appendChild(badge(c.state === 'pending' ? 'waiting for first join' : c.state, c.state === 'active' ? 'on' : c.state));
            tr.appendChild(sc);
            tr.appendChild(mk('td', {text: c.expires_at ? new Date(c.expires_at * 1000).toLocaleString() : ''}));
            const ac = document.createElement('td');
            if (c.state !== 'revoked') {
                if (IS_ADMIN) ac.appendChild(btn('Show passphrase / QR', '', () => wifiAct('POST', '/api/segmentation/wifi/credentials/' + c.id + '/reveal', null, c.device)));
                if (CAN_MODIFY) {
                    ac.appendChild(btn('Rotate', '', () => { if (confirm('Give ' + c.device + ' a new passphrase? The old one stops working at once.')) wifiAct('POST', '/api/segmentation/wifi/devices/' + c.device_id + '/rotate', {grace_minutes: 0}, c.device); }));
                    ac.appendChild(btn('Revoke', 'danger', () => { if (confirm('Revoke the passphrase of ' + c.device + '? It is disconnected from the Wi-Fi.')) segCall('POST', '/api/segmentation/wifi/credentials/' + c.id + '/revoke').then(wifiLoad); }));
                }
            }
            tr.appendChild(ac); cb.appendChild(tr);
        }
        ct.appendChild(cb); root.appendChild(mk('div', {class: 'seg-wrap'}, ct));
        if (!d.credentials.length) root.appendChild(mk('p', {class: 'empty', text: 'No device has a Wi-Fi passphrase yet.'}));
        if (CAN_MODIFY && d.networks.length) {
            const f = document.createElement('form'); f.className = 'lan-form';
            f.appendChild(field('Device name', inp('name', 'kitchen-tablet', undefined, true)));
            f.appendChild(field('Network', sel('network', d.networks.map(n => n.name))));
            const gs = document.createElement('select'); gs.name = 'group'; for (const g of (SEG ? SEG.groups : []).filter(g => !g.quarantine)) { const o = document.createElement('option'); o.value = g.name; o.textContent = g.name; gs.appendChild(o); }
            f.appendChild(field('Group', gs));
            f.appendChild(field('MAC (optional: learned at the first join)', inp('mac', 'aa:bb:cc:dd:ee:ff')));
            f.appendChild(mk('button', {class: 'btn btn-primary', type: 'submit', text: 'Create device and passphrase'}));
            f.onsubmit = async (ev) => { ev.preventDefault(); await wifiAct('POST', '/api/segmentation/wifi/devices', formBody(f), 'New device'); f.reset(); return false; };
            root.appendChild(f);
        }
        root.appendChild(mk('h3', {text: 'Connected stations'}));
        root.appendChild(mk('div', {id: 'wifi-stations', class: 'seg-wrap'}));
        wifiStations();
    }

    async function wifiStations() {
        const s = await api('GET', '/api/segmentation/wifi/stations'); if (!s) return;
        const el = document.getElementById('wifi-stations'); if (!el) return; el.innerHTML = '';
        if (!s.length) { el.appendChild(mk('p', {class: 'empty', text: 'No station is connected (or the access point is not running).'})); return; }
        const t = mk('table', {class: 'lan'});
        t.appendChild(mk('thead', {}, (() => { const tr = document.createElement('tr'); for (const h of ['MAC', 'Network', 'Device', 'Group', 'Authorized']) tr.appendChild(mk('th', {text: h})); return tr; })()));
        const b = document.createElement('tbody');
        for (const x of s) { const tr = document.createElement('tr'); tr.appendChild(mk('td', {class: 'mono', text: x.mac})); tr.appendChild(mk('td', {text: x.network})); tr.appendChild(mk('td', {text: x.device || '(unknown: quarantine)'})); tr.appendChild(mk('td', {text: x.group || ''})); tr.appendChild(mk('td', {text: x.authorized ? 'yes' : 'no'})); b.appendChild(tr); }
        t.appendChild(b); el.appendChild(t);
    }

    // POST something that answers with a secret: show it once, in the page, never in a URL
    async function wifiAct(method, url, body, title) {
        const r = await api(method, url, body === null ? {} : body); if (!r) return;
        const box = document.getElementById('wifi-issued'); if (!box) { await wifiLoad(); return; }
        box.innerHTML = '';
        const card = mk('div', {class: 'seg-note'});
        card.appendChild(mk('strong', {text: (title || 'Passphrase') + (r.ssid ? ' - join "' + r.ssid + '" with:' : ':')}));
        card.appendChild(mk('pre', {class: 'seg-pre', text: r.secret}));
        if (r.qr_svg) { const q = document.createElement('div'); q.style.maxWidth = '200px'; q.innerHTML = r.qr_svg; card.appendChild(q); }
        if (r.note) card.appendChild(mk('div', {text: r.note}));
        card.appendChild(btn('Hide', '', () => { box.innerHTML = ''; }));
        box.appendChild(card);
        await segLoad(); const keep = box.firstChild; await wifiLoadKeep(keep);
    }
    async function wifiLoadKeep(card) {
        const d = await api('GET', '/api/segmentation/wifi'); if (!d) return;
        WIFI = d; wifiRender(); const box = document.getElementById('wifi-issued'); if (box && card) box.appendChild(card);
    }
    // from the Discovered tab: approve an unknown station that joined with the enrolment secret
    async function wifiApprove(mac, hostname) {
        if (!WIFI) await wifiLoad();
        const nets = (WIFI && WIFI.networks) || [];
        if (!nets.length) { showError('Add a Wi-Fi network first.'); return; }
        const name = prompt('Name for this device:', (hostname || '').toLowerCase().replace(/[^a-z0-9_-]/g, '-').slice(0, 24) || 'new-device'); if (!name) return;
        segTab('wifi');
        await wifiAct('POST', '/api/segmentation/wifi/devices', {name, mac, network: (nets.find(n => n.unknown_policy === 'enrol') || nets[0]).name}, 'Personal passphrase for ' + name);
    }
</script>
