<script>
    // The UI talks to the same JSON API as any client: every form becomes a
    // JSON body; numbers stay numbers; empty fields are omitted.
    function formJson(form) {
        const o = {};
        for (const el of form.elements) {
            if (!el.name) continue;
            if (el.type === 'checkbox') { o[el.name] = el.checked; continue; }
            if (el.value === '' && !el.dataset.keepEmpty) continue;
            o[el.name] = el.type === 'number' ? Number(el.value) : el.value;
        }
        return o;
    }
    async function call(method, url, body) {
        const r = await fetch(url, {
            method, credentials: 'same-origin',
            headers: body ? {'content-type': 'application/json'} : {},
            body: body ? JSON.stringify(body) : undefined,
        });
        if (!r.ok) {
            let msg = r.status + '';
            try { msg = (await r.json()).error || msg; } catch (_) {}
            alert('Not applied: ' + msg);
            return false;
        }
        location.reload();
        return true;
    }
    function submitJson(ev, method, url) {
        ev.preventDefault();
        call(method, url, formJson(ev.target));
        return false;
    }
    function del(url, question) {
        if (confirm(question)) call('DELETE', url);
    }
</script>
