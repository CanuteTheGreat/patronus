<style>
    /* LAN-service pages (DHCP, DNS, NTP, segmentation, svc/*): tables and forms on the ui-kit tokens; the shared
       table look (30 px rows, sunken header) comes from base.html. */
    table.lan { width: 100%; margin: 8px 0 16px; }
    form.lan-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 8px 0; }
    /* a flex item never grows past the form: without min-width 0 a label took the intrinsic width of its textarea (cols) or input (size) and the page scrolled sideways on a phone */
    form.lan-form label { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-sm); color: var(--c-muted); min-width: 0; max-width: 100%; }
    /* a checkbox sits in front of its label text on one line (stacked, it floated above its words in long forms) */
    form.lan-form label:has(> input[type=checkbox]) { flex-direction: row; align-items: center; gap: 6px; align-self: center; }
    form.lan-form input, form.lan-form select { min-width: 120px; }
    form.lan-form input[type=checkbox] { min-width: 0; }
    form.lan-form input, form.lan-form select, form.lan-form textarea { max-width: 100%; box-sizing: border-box; }
    .ok { color: var(--c-ok); font-weight: 600; }
    .bad { color: var(--c-crit); font-weight: 600; }
    .empty { color: var(--c-muted); padding: var(--s-3) 0; }
    .alert-error { background: var(--c-crit-bg); color: var(--c-crit); border: 1px solid var(--c-border); padding: 8px var(--s-3); border-radius: var(--r-md); margin-bottom: 12px; }
    .mono { font-family: var(--font-mono); }
    table.lan select { min-height: 24px; }
</style>
