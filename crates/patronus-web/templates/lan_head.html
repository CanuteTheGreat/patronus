<style>
    table.lan { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }
    table.lan th, table.lan td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; font-size: 0.9em; }
    form.lan-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin: 8px 0; }
    /* a flex item never grows past the form: without min-width 0 a label took the intrinsic width of its textarea (cols) or input (size) and the page scrolled sideways on a phone */
    form.lan-form label { display: flex; flex-direction: column; font-size: 0.8em; color: var(--muted); min-width: 0; max-width: 100%; }
    form.lan-form input, form.lan-form select { padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 4px; min-width: 120px; }
    form.lan-form input, form.lan-form select, form.lan-form textarea { max-width: 100%; box-sizing: border-box; }
    .ok { color: var(--ok-fg); font-weight: 600; }
    .bad { color: var(--bad-fg); font-weight: 600; }
    .empty { color: var(--muted); font-style: italic; }
    .alert-error { background: var(--bad-bg); color: var(--bad-fg); padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    .mono { font-family: monospace; }
    table.lan select { min-height: 24px; }
</style>
