<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<script>
/* Follow the device light/dark setting by default (live, no flash: this runs before first paint).
   An explicit choice from the header button is kept in localStorage 'patronus-theme' and sets
   <html data-theme="light|dark">; no attribute = follow the system (ui-kit theming contract). */
(function () {
    try {
        var t = localStorage.getItem('patronus-theme');
        if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            var c = t === 'dark' ? '#0f1216' : '#f3f4f6';
            document.write('<meta name="theme-color" content="' + c + '">');
        }
    } catch (e) {}
})();
</script>
<!-- shared ui-kit (vendored and pinned: crates/patronus-web/ui-kit/ui-kit.pin), then the Patronus theme layer
     (crates/patronus-web/theme/patronus.css). Render-blocking stylesheets in <head>: no flash of the wrong scheme. -->
<link rel="stylesheet" href="/ui-kit/tokens.css">
<link rel="stylesheet" href="/ui-kit/components.css">
<link rel="stylesheet" href="/ui-kit/patronus.css">
<script src="/ui-kit/ui.js" defer></script>
<style>
    :root { color-scheme: light dark; }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: light; }
    /* pages that style their own body still get the themed canvas (dark mode on a white page fails contrast) */
    body { background: var(--c-canvas); color: var(--c-ink); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
