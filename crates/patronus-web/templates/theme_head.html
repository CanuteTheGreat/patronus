<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
<script>
/* Follow the device light/dark setting by default (live, no flash: this runs before first paint).
   An explicit choice from the header button is kept in localStorage 'patronus-theme' and sets
   <html data-theme="light|dark">; no attribute = follow the system. */
(function () {
    try {
        var t = localStorage.getItem('patronus-theme');
        if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            var c = t === 'dark' ? '#1a1a1a' : '#f5f5f5';
            document.write('<meta name="theme-color" content="' + c + '">');
        }
    } catch (e) {}
})();
</script>
