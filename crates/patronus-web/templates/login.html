<!DOCTYPE html>
<html lang="{{ ""|lang_code }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    {% include "theme_head.html" %}
    <title>{{ "login-title"|t }} - Patronus Firewall</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--login-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .login-logo {
            display: block;
            /* the artwork is portrait (2:3): size it by height so a phone keeps the form above the fold */
            height: min(170px, 22vh);
            width: auto;
            max-width: 60vw;
            margin: 1rem auto 0;
            border-radius: 18px; /* the artwork is on its own dark tile in both schemes */
        }
        .login-lang { margin-top: 1rem; text-align: center; font-size: .9rem; color: var(--text-muted); }
        .login-lang a { color: var(--primary); margin: 0 .35rem; }
        .login-lang a[aria-current] { color: var(--text); font-weight: 600; text-decoration: none; }
        .login-container {
            color: var(--ink);
            box-sizing: border-box;
            width: calc(100% - 2rem);
            max-width: 400px;
            margin: 1rem auto 2rem;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 10px var(--shadow);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: var(--accent);
            margin: 0;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--ink-2);
        }
        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.75rem;
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--ink);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: var(--b-blue);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: var(--b-blue-hover);
        }
        .error-message {
            display: none;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background: var(--bad-bg);
            border: 1px solid #ef4444;
            border-radius: 6px;
            color: var(--bad-fg);
        }
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
<main>
    <img class="login-logo" src="/brand/full.webp" alt="Patronus" width="256" height="384">
    <div class="login-container">
        <div class="login-header">
            <h1>Patronus</h1>
            <p>{{ "login-subtitle"|t }}</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">{{ "login-username"|t }}</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">{{ "login-password"|t }}</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group" id="totp-group" style="display:none">
                <label for="totp_code">{{ "login-totp"|t }}</label>
                <input type="text" id="totp_code" name="totp_code" autocomplete="one-time-code" inputmode="text">
            </div>

            <button type="submit" class="btn-login">{{ "login-submit"|t }}</button>
        </form>
        <nav class="login-lang" aria-label="{{ "login-language"|t }}">{{ "login-language"|t }}: {{ ""|lang_links|safe }}</nav>
    </div>

</main>
    <script>
        window.PATRONUS_I18N = {{ ""|js_catalog|safe }};
        function tr(key) { return (window.PATRONUS_I18N || {})[key] || key; }
    </script>
    <script>
        // What another firmware served at this address before Patronus may still live in the browser.
        // Patronus registers no service worker and uses no Cache Storage, so any found here is foreign:
        // remove it, or it could keep answering requests for this address instead of Patronus.
        // (The server clears the HTTP cache and foreign cookies with this page's response.)
        try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                navigator.serviceWorker.getRegistrations()
                    .then(regs => regs.forEach(r => r.unregister()))
                    .catch(() => {});
            }
            if (window.caches && caches.keys) {
                caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
            }
        } catch (e) {}

        function showError(text) {
            const errorMsg = document.getElementById('error-message');
            errorMsg.textContent = text;
            errorMsg.classList.add('show');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.remove('show');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const totp_code = document.getElementById('totp_code').value.trim();

            let response;
            try {
                response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    cache: 'no-store',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(totp_code ? { username, password, totp_code } : { username, password }),
                });
            } catch (err) {
                showError(tr('js-login-network-error'));
                return;
            }

            if (response.ok) {
                // The password was accepted. Make sure the browser now sends the session back before
                // leaving this page: otherwise the dashboard would just bounce back here with no word why.
                let me = null;
                try {
                    me = await fetch('/api/auth/me', { credentials: 'same-origin', cache: 'no-store' });
                } catch (err) {}
                if (me && me.ok) {
                    window.location.href = '/';
                    return;
                }
                showError(tr('js-login-cookie-stuck'));
                return;
            }

            let error = {};
            try {
                error = await response.json();
            } catch (err) {}
            if (error.totp_required) {
                // password accepted: ask for the second factor
                document.getElementById('totp-group').style.display = 'block';
                document.getElementById('totp_code').focus();
            }
            showError(error.error || tr('js-login-failed').replace('{$status}', response.status));
        });
    </script>
</body>
</html>
