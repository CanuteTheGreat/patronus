[package]
name = "patronus-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "patronus-web"
path = "src/main.rs"

[lib]
name = "patronus_web"
path = "src/lib.rs"

[features]
# Features mapped from the Gentoo USE flags of the same name (the ebuild
# builds patronus-web with --no-default-features and the USE-selected list):
# lane C interfaces (vlan, pppoe, dhcpcd) and the lane D LAN-service pages
# (dhcp, dns, ntp).
default = ["vlan", "pppoe", "dhcpcd", "dhcp", "dns", "ntp", "multiwan", "wireguard", "ipsec", "totp", "ha", "qos", "syslog", "netflow", "igmp", "nat64", "l2tp", "upnp", "vrf", "openvpn", "web-proxy", "intrusion-detection", "dynamic-routing", "sdwan-edge", "ldap", "plugins", "segmentation", "wifi-ap", "threat-feeds", "journal", "tls-rustls"]
vlan = ["patronus-network/vlan"]
pppoe = ["patronus-network/pppoe"]
dhcpcd = ["patronus-network/dhcpcd"]
dhcp = ["patronus-network/dhcp"]
dns = ["patronus-network/dns"]
ntp = ["patronus-network/ntp"]
# lane E: gateway groups (multi-WAN failover / load balancing)
multiwan = ["patronus-network/multiwan"]
# lane F: WireGuard tunnels/peers and IPsec tunnels managed from the VPN page
wireguard = ["patronus-network/wireguard"]
ipsec = ["patronus-network/ipsec"]
# lane G: high availability (keepalived VRRP virtual IPs + conntrackd state sync)
ha = ["patronus-network/ha"]
# lane C: traffic shaping (tc: CAKE / fq_codel / rate limit)
qos = ["patronus-network/qos"]
# feature pages (syslog, NetFlow, IGMP proxy, NAT64, L2TP, IDS, BGP/OSPF)
syslog = ["patronus-network/syslog"]
netflow = ["patronus-network/netflow"]
igmp = ["patronus-network/igmp"]
nat64 = ["patronus-network/nat64"]
l2tp = ["patronus-network/l2tp"]
upnp = ["patronus-network/upnp"]
vrf = ["patronus-network/vrf"]
openvpn = ["patronus-network/openvpn"]
web-proxy = ["patronus-network/web-proxy"]
intrusion-detection = ["patronus-network/intrusion-detection"]
dynamic-routing = ["patronus-network/dynamic-routing"]
sdwan-edge = ["patronus-network/sdwan-edge"]
# lane H: TOTP two-factor authentication for web accounts
totp = ["dep:hmac", "dep:sha1"]
# LDAP / Active Directory web login (USE=ldap)
ldap = ["dep:ldap3"]
# signed plugins + Gentoo component packages (Packages page)
plugins = ["patronus-network/plugins"]
# device groups, per-device isolation and Wi-Fi credentials (page + API)
segmentation = ["patronus-network/segmentation", "dep:patronus-captiveportal"]
wifi-ap = ["patronus-network/wifi-ap", "segmentation"]
# Live threat-intel feeds (patronus-ai, reqwest/OpenSSL) and journald log reading
# (patronus-monitoring, prometheus). Both are off in the embedded router build.
threat-feeds = ["dep:patronus-ai"]
journal = ["dep:patronus-monitoring"]
# TLS backend. `tls-rustls` (default; aws-lc-rs + rcgen) does not build for MIPS
# (neither aws-lc nor ring supports it); the embedded tier uses `tls-openssl`
# (system OpenSSL, certificate generation through the same library).
tls-rustls = ["axum-server/tls-rustls", "dep:rustls", "dep:rcgen"]
tls-openssl = ["axum-server/tls-openssl", "dep:openssl"]

[dependencies]
patronus-core = { path = "../patronus-core" }
patronus-firewall = { path = "../patronus-firewall" }
patronus-captiveportal = { path = "../patronus-captiveportal", optional = true }
patronus-network = { path = "../patronus-network" }
patronus-config = { path = "../patronus-config" }
patronus-secrets = { path = "../patronus-secrets" }
patronus-ai = { path = "../patronus-ai", optional = true }
patronus-monitoring = { path = "../patronus-monitoring", optional = true }

tokio.workspace = true
async-trait.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
askama.workspace = true
askama_axum.workspace = true

# TLS for the dashboard (self-signed cert on first run; see src/tls.rs)
axum-server = { version = "0.7" }
# Explicit process-wide crypto provider: when another crate in the same
# binary (e.g. patronus-cli's `patronus web`) also enables rustls' `ring`,
# rustls can no longer pick one and panics on the first TLS handshake setup.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }
rcgen = { version = "0.11", optional = true }
openssl = { version = "0.10", optional = true }

# Additional web dependencies
hyper = "1.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
qrcode = { version = "0.14", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
rand = "0.8"
sysinfo = "0.31"
# lane H: web accounts live in the config store (web_users)
sqlx.workspace = true
sha2 = "0.10"
# RADIUS (RFC 2865) for external web logins
md-5 = "0.10"
# LDAP login for USE=ldap (TLS via native-tls/OpenSSL: ldap3's rustls path pins rustls 0.21, which cargo audit rejects)
ldap3 = { version = "0.11", default-features = false, features = ["tls-native"], optional = true }
# TOTP (RFC 6238) for USE=totp
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }
# statvfs (real disk usage), hostname, CLK_TCK (service uptimes)
nix = { workspace = true, features = ["fs", "hostname", "feature"] }
libc = "0.2"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
pwhash = "1"
