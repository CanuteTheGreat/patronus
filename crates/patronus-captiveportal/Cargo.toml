[package]
name = "patronus-captiveportal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# the captive portal itself (USE=captive-portal); without it only the time's-up page
portal = ["dep:patronus-network", "dep:md-5"]

[dependencies]
patronus-config = { path = "../patronus-config" }
patronus-network = { path = "../patronus-network", optional = true, default-features = false, features = ["captive-portal"] }
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
md-5 = { version = "0.10", optional = true }
