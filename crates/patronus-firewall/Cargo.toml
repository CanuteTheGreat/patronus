[package]
name = "patronus-firewall"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["nftables"]
nftables = ["dep:nftnl", "dep:mnl"]
iptables = []
geoip = []

[dependencies]
patronus-core = { path = "../patronus-core" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
nix.workspace = true

# For nftables interaction (optional)
nftnl = { version = "0.9", optional = true }
mnl = { version = "0.3", optional = true }

# CI test-harness example deps
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = "0.3"

[[example]]
name = "apply_ruleset"
