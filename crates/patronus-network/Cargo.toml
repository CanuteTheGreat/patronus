[package]
name = "patronus-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# LAN services (lane D). The daemons are external Gentoo packages (kea or
# dnsmasq, radvd, unbound, chrony); these features compile the appliers.
dhcp = []
dns = []
ntp = []
# Lane F: WireGuard tunnels (keys generated in-process, kernel module +
# wireguard-tools at runtime) and IPsec IKEv2 via strongSwan swanctl.
wireguard = ["dep:x25519-dalek", "dep:base64", "dep:rand"]
openvpn = []
ipsec = ["dep:rand", "dep:base64"]
# Lane C: VLAN/QinQ subinterfaces (USE=vlan), PPPoE client (USE=pppoe),
# dhcpcd as the preferred DHCP client (USE=dhcpcd; else busybox udhcpc).
vlan = []
pppoe = []
dhcpcd = []
qos = []
# Lane E: gateway groups (multi-WAN failover / load balancing) and the
# default route through them (USE=multiwan). Static routes, gateways and
# gateway monitoring are always built.
multiwan = []
ha = []
intrusion-detection = []
dynamic-routing = []
# Feature pages (svc.rs): each needs its daemon at runtime (Gentoo USE flag of the same name)
syslog = []
netflow = []
igmp = []
nat64 = []
l2tp = []
upnp = []
vrf = []
# device segmentation (lane s): L2 isolation settings (proxy ARP, isolated bridge ports)
# for the nft default-deny table; the rules themselves are always compiled
segmentation = []
# per-device Wi-Fi credentials: hostapd config + wpa_psk_file (RDEPEND net-wireless/hostapd)
wifi-ap = ["segmentation"]
# signed plugins + Gentoo package jobs (Packages page)
plugins = ["dep:ed25519-dalek", "dep:base64", "dep:rand", "dep:sha2"]
web-proxy = []
# SD-WAN edge agent page + applier (the agent itself is `patronus edge run`)
sdwan-edge = ["wireguard"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = "3.10"

[dependencies]
patronus-core = { path = "../patronus-core" }
patronus-config = { path = "../patronus-config" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
nix = { workspace = true, features = ["signal", "process", "user", "fs"] }
libc = "0.2"
sqlx.workspace = true
serde_json.workspace = true
chrono.workspace = true
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
rtnetlink = "0.14"
ipnetwork = "0.20"
futures = "0.3"
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }
base64 = { version = "0.22", optional = true }
ed25519-dalek = { version = "2.1", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }

# wireguard-control = { workspace = true, optional = true }  # Removed - not used
