[package]
name = "patronus-network"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# LAN services (lane D). The daemons are external Gentoo packages (kea or
# dnsmasq, radvd, unbound, chrony); these features compile the appliers.
dhcp = []
dns = []
ntp = []
wireguard = []
openvpn = []
ipsec = []
# Lane C: VLAN/QinQ subinterfaces (USE=vlan), PPPoE client (USE=pppoe),
# dhcpcd as the preferred DHCP client (USE=dhcpcd; else busybox udhcpc).
vlan = []
pppoe = []
dhcpcd = []
qos = []
multiwan = []
ha = []
intrusion-detection = []
dynamic-routing = []

[[example]]
name = "ha_cluster"
required-features = ["ha"]

[[example]]
name = "ha_test_master"
required-features = ["ha"]

[[example]]
name = "ha_test_backup"
required-features = ["ha"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = "3.10"

[dependencies]
patronus-core = { path = "../patronus-core" }
patronus-config = { path = "../patronus-config" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
nix = { workspace = true, features = ["signal", "process", "user", "fs"] }
sqlx.workspace = true
serde_json.workspace = true
chrono.workspace = true
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
rtnetlink = "0.14"
ipnetwork = "0.20"
futures = "0.3"

# wireguard-control = { workspace = true, optional = true }  # Removed - not used
